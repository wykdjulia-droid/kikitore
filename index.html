<!doctype html>
<html lang="en">
<head>

<title>Tidewater Isles</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%233f9ea3'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%2396c84a'/%3E%3Crect x='3' y='12' width='10' height='2' fill='%23a87b4f'/%3E%3Crect x='7' y='2' width='2' height='5' fill='%231d3a22'/%3E%3C/svg%3E">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one pixel board on a slate table, a narrow tool rail beside it (stacks under on phones). Single deliberate dark look. */
:root{
  --table:#24343f; --rail:#2f4351; --rail-edge:#1a262e;
  --ink:#e8f3e6; --muted:#9db5bb; --grass:#96c84a; --grass-dark:#1d3a22;
  --foam:#dff5e8; --sea:#3f9ea3; --danger:#e48a6a;
  --display:"Pixelify Sans", "DotGothic16", "Courier New", monospace;
  --label:"Silkscreen", "DotGothic16", "Courier New", monospace;
  --read:Calibri, "Carlito", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;   /* letters and questions: Calibri, or its free twin Carlito where Calibri isn't installed */
  color-scheme:dark;
}
html,body{background:var(--table);color:var(--ink)}
body{font-family:var(--display);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{margin:0;font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:1px;color:var(--grass);text-shadow:3px 3px 0 var(--grass-dark);text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:16px}
.game{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
@media (max-width:760px),(orientation:portrait) and (max-width:1100px){.game{grid-template-columns:minmax(0,1fr)}
  aside{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}}
@media (min-width:600px) and (max-width:760px),(orientation:portrait) and (min-width:600px) and (max-width:1100px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:599px){aside{grid-template-columns:minmax(0,1fr)}}
/* keep the whole board on screen when the window is short (laptops, phones turned sideways) */
.frame{width:min(calc(100% - 16px),calc((100svh - 60px) * .952 + 16px));justify-self:center;box-sizing:border-box}
@media (max-height:520px){body{padding-block:10px 16px}header{display:none}}
/* touch niceties */
html{-webkit-text-size-adjust:100%}
button,.board{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.board{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card-body,.letter-text{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.frame{background:var(--rail-edge);padding:8px;box-shadow:0 0 0 4px var(--rail),0 0 0 8px var(--rail-edge);margin:8px;min-width:0}
canvas{display:block;}
#board{width:100%;height:auto;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;touch-action:none}
.board{position:relative;container-type:inline-size}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--rail-edge);color:var(--foam);border:2px solid #4c6575;padding:6px 12px;font-size:15px;width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.3;z-index:6;pointer-events:none}
/* letters: a button on the board and a reading panel that slides up over its lower part */
.letters{position:absolute;top:10px;left:10px;z-index:3;display:flex;align-items:center;gap:8px;background:rgba(246,236,214,.4);color:#3a2a22;border:3px solid #3a2a22;box-shadow:0 3px 0 #3a2a22;padding:6px 10px 6px 8px;font-weight:700}
.topright{position:absolute;top:10px;right:10px;z-index:5;display:flex;gap:8px;align-items:stretch;pointer-events:none}
.infobtn{pointer-events:auto;width:40px;padding:0;border-radius:50%;aspect-ratio:1;align-self:center;background:rgba(246,236,214,.4);color:#3a2a22;border:3px solid #3a2a22;box-shadow:0 3px 0 #3a2a22;
  font:italic 700 22px/1 Georgia,"Times New Roman",serif;display:grid;place-items:center}
@media (hover:hover){.infobtn:hover{background:rgba(255,245,223,.8);border-color:#3a2a22}}
.guide{display:grid;gap:8px}

.goldtab svg{width:20px;height:20px;flex:none}
.goldtab b{font-variant-numeric:tabular-nums;min-width:1.2em}
.goldtab.bump{animation:nudge .6s ease-in-out 1}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;max-height:68%;display:flex;flex-direction:column;
  background:linear-gradient(to bottom,rgba(26,38,46,0) 0,rgba(26,38,46,.55) 18px,rgba(26,38,46,.9) 46px,#1a262e 70px);padding:40px 10px 10px}

.portrait{flex:none;width:calc(clamp(150px,34%,300px) * var(--pw,1));height:auto;align-self:flex-end;margin-bottom:0;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card button{font-size:16px;background:#3a2a22;color:#f6ecd6;border-color:#3a2a22;box-shadow:0 3px 0 #1d1511}
.card button.ghost{background:transparent;color:#3a2a22}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.portrait{width:calc(104px * var(--pw,1))}.card-body{font-size:17px}.sheet{max-height:90%;padding-top:24px}.card{max-height:calc(105cqw * .9 - 34px)}}
.opts button{text-align:left;background:#fffaf0;color:#3a2a22;box-shadow:0 3px 0 #3a2a22;border-color:#3a2a22;line-height:1.3}

.opts button b{display:inline-block;min-width:1.4em;color:#c8453d}
.opts button.right{background:#bfe39a}
.opts button.wrong{background:#f2b3a8}
.verdict{font-weight:700;font-size:19px}
.ochain{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap}
.oslot{position:relative;width:clamp(44px,13%,64px);aspect-ratio:1;max-width:100%;border:3px dashed #b79b6c;background:rgba(255,250,240,.7);display:grid;place-items:center}
.oslot .n{position:absolute;top:1px;left:4px;font-size:12px;font-weight:700;color:#9a7b52}
.oslot b{font-size:26px;color:#3a2a22;line-height:1}
.oslot.next{border-color:#3a2a22}
.oslot.filled{border-style:solid;border-color:#3a2a22;background:#fffaf0;box-shadow:0 3px 0 #3a2a22}
.ochain .arr{color:#9a7b52;font-size:20px;flex:none}
.orow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.orow .go{margin-left:auto;background:#c8453d;border-color:#7e2620;box-shadow:0 3px 0 #7e2620;color:#fff;font-weight:700;padding-inline:18px}
.orow .go:disabled{background:#d9a59c;border-color:#b07a72;box-shadow:0 3px 0 #b07a72}
.events button.odd,.events button.odd:disabled{opacity:1;border-style:dashed;background:#f3e3cc}
.events .tag.x{background:#a8322a}
.events{display:grid;gap:6px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.events{grid-template-columns:1fr}}
.events button{padding:5px 8px;font-size:16px!important;text-align:left;background:#fffaf0;color:#3a2a22;box-shadow:0 3px 0 #3a2a22;border-color:#3a2a22;line-height:1.3;display:flex;gap:8px;align-items:baseline}
.events button b{color:#c8453d;min-width:1.2em}
.events button:disabled{opacity:.45}
.events .tag{margin-left:auto;background:#3a2a22;color:#f6ecd6;font-size:13px;padding:0 6px;font-variant-numeric:tabular-nums}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.slots li{display:flex;gap:8px;align-items:baseline;border:2px dashed #c9b48c;padding:2px 8px;min-height:1.6em;font-size:16px;background:rgba(255,250,240,.6)}
.slots li.next{border-color:#3a2a22;border-style:solid}
.slots li.odd{margin-top:4px;background:#f1e0c4}
.slots .sl{flex:none;min-width:6.6em;font-weight:700;color:#7a5a3a;font-size:.9em}
.slots .sv{min-width:0}
.slots .sv small{display:block;color:#a8322a;font-size:.85em}
.slots.result li{border-style:solid}
.slots.result li.good{border-color:#5c9a3a;background:#e4f3d2}
.slots.result li.bad{border-color:#c8453d;background:#f8dcd5}
.verdict.good{color:#2f7a2a}.verdict.bad{color:#a8322a}
.coins{color:#8a5a00;font-weight:700}
.why{background:#fffaf0;border-left:4px solid #c8453d;padding:8px 10px}
#trees{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;image-rendering:auto}
aside{background:var(--rail);border:3px solid var(--rail-edge);padding:14px;display:grid;gap:16px;min-width:0}
.lbl{font-family:var(--label);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font-family:var(--display);font-size:16px;color:var(--ink);background:var(--rail-edge);border:2px solid #4c6575;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 #111a20;transition:transform .05s}
button:hover{border-color:var(--muted)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #111a20}
button:focus-visible{outline:3px solid var(--foam);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.reset.armed{background:#a8322a;border-color:#e48a6a;color:#fff}
#bUndo,#bRedo{white-space:nowrap;font-size:15px;padding-inline:4px}
button:disabled:active{transform:none;box-shadow:0 3px 0 #111a20}
button[aria-pressed="true"]{background:var(--grass);color:var(--grass-dark);border-color:var(--grass-dark);font-weight:700}
button[aria-pressed="true"].sink{background:var(--sea);color:#0f2a2e}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--rail-edge);padding:8px 10px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--foam)}
.stat span{font-family:var(--label);font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.tip{margin:0;font-size:15px;line-height:1.4;color:var(--muted)}
.tip kbd{font-family:var(--label);font-size:11px;background:var(--rail-edge);padding:1px 5px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
@media (max-width:560px),(max-height:520px){
  .sheet{position:fixed;inset:0;z-index:50;max-height:none;background:rgba(26,38,46,.97);
    padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .card{max-height:none;flex:1}
  body:has(.sheet:not([hidden])){overflow:hidden}
}
@media (max-width:560px) and (min-height:521px){
  .sheet-in{flex-direction:column;align-items:stretch;gap:0;justify-content:center}
  .portrait{width:auto;height:min(26svh,200px);align-self:flex-start;margin:0 0 -6px 6px;position:relative;z-index:1}
  .card{min-height:0;flex:0 1 auto}
}
@media (max-height:520px){
  .sheet-in{align-items:stretch}
  .portrait{width:auto;height:min(calc(100svh - 24px),370px);align-self:flex-end;object-fit:contain;object-position:bottom;max-width:30vw}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tidewater Isles</h1>
    <p data-ja="海から土地を持ち上げよう。となり合うマスは1つの島になります。">Raise land from the sea. Neighbouring tiles join into one island.</p>
  </header>
  <div class="game">
    <div class="frame"><div class="board"><canvas id="board" width="320" height="336" aria-label="20 by 20 sea board. Click a tile to raise an island."></canvas><canvas id="trees" aria-hidden="true"></canvas><div class="toast" id="toast" role="status" hidden></div>
      <div class="topright"><button class="infobtn" id="infoBtn" aria-label="How your town grows" title="How your town grows">i</button><div class="goldtab" id="goldTab" role="status" aria-label="Gold"><svg viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><rect x="2" y="0" width="4" height="8" fill="#7a4a00"/><rect x="0" y="2" width="8" height="4" fill="#7a4a00"/><rect x="1" y="1" width="6" height="6" fill="#7a4a00"/><rect x="2" y="1" width="4" height="6" fill="#ffd23f"/><rect x="1" y="2" width="6" height="4" fill="#ffd23f"/><rect x="3" y="2" width="2" height="4" fill="#e0a92a"/><rect x="2" y="2" width="1" height="1" fill="#fff3b0"/></svg><b id="goldN">0</b></div></div>
      <button class="letters" id="lettersBtn" hidden aria-label="Read your letters"><svg viewBox="0 0 11 8" aria-hidden="true" shape-rendering="crispEdges"><rect x="0" y="0" width="11" height="8" fill="#3a2a22"/><rect x="1" y="1" width="9" height="6" fill="#fffaf0"/><rect x="1" y="1" width="1" height="1" fill="#3a2a22"/><rect x="2" y="2" width="1" height="1" fill="#3a2a22"/><rect x="3" y="3" width="1" height="1" fill="#3a2a22"/><rect x="4" y="4" width="3" height="1" fill="#3a2a22"/><rect x="7" y="3" width="1" height="1" fill="#3a2a22"/><rect x="8" y="2" width="1" height="1" fill="#3a2a22"/><rect x="9" y="1" width="1" height="1" fill="#3a2a22"/><rect x="5" y="5" width="1" height="1" fill="#c8453d"/></svg><span data-ja="手紙">Letters</span><b id="lettersN">0</b></button>
      <div class="sheet" id="sheet" hidden role="dialog" aria-modal="false" aria-labelledby="qWho">
        <div class="sheet-in"><img class="portrait" id="qPortrait" alt="">
          <div class="card"><div class="card-head"><span class="who" id="qWho"></span><span class="lvl" id="qLvl"></span><button class="x" id="qClose" aria-label="Close the letter">&#x2715;</button></div>
            <div class="card-body" id="qBody"></div></div></div>
      </div></div></div>
    <aside>
      <div>
        <p class="lbl" data-ja="道具">Tool</p>
        <div class="seg">
          <button id="tRaise" aria-pressed="true" data-ja="上げる">Raise</button>
          <button id="tSink" class="sink" aria-pressed="false" data-ja="しずめる">Sink</button>
          <button id="bUndo" title="Go back (Ctrl+Z)" disabled data-ja="◀ もどす">&#9664; Back</button>
          <button id="bRedo" title="Go forward (Ctrl+Shift+Z)" disabled data-ja="すすむ ▶">Forward &#9654;</button>
          <button id="bReset" class="reset" style="grid-column:1/-1" data-ja="リセット">Reset</button>
          <button id="bLang" style="grid-column:1/-1" aria-label="Language / 言語">日本語</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sGold">0</b><span data-ja="ゴールド">Gold</span></div>
        <div class="stat"><b id="sTime">0:00:00</b><span data-ja="プレイ時間">Time played</span></div>
        <div class="stat"><b id="sLand">0</b><span data-ja="土地 / 400">Land / 400</span></div>
        <div class="stat"><b id="sTree">0</b><span data-ja="木">Trees</span></div>
        <div class="stat"><b id="sHouse">0</b><span data-ja="家">Homes</span></div>
        <div class="stat"><b id="sShop">0</b><span data-ja="お店">Shops</span></div>
        <div class="stat"><b id="sPpl">0</b><span data-ja="住人">Villagers</span></div>
        <div class="stat"><b id="sCastle">0</b><span data-ja="お城">Castles</span></div>
      </div>
    </aside>
  </div>
</div>

<script>
const N=20,T=16,W=N*T,H=N*T+T;
const cv=document.getElementById('board'),ctx=cv.getContext('2d');
let grid=new Uint8Array(N*N);
const L=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&grid[y*N+x]===1;
const hash=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0;};
const outside=(a,b,r)=>{const dx=r-a-.5,dy=r-b-.5;return dx*dx+dy*dy>r*r;};
const scallop=v=>((v%6)+6)%6<2?1:0;

function grassAt(px,py){
  if(px<0||py<0||px>=W||py>=N*T)return false;
  const cx=px>>4,cy=py>>4,lx=px&15,ly=py&15;
  if(L(cx,cy)){
    const n=!L(cx,cy-1),s=!L(cx,cy+1),w=!L(cx-1,cy),e=!L(cx+1,cy),r=5;
    if(n&&w&&lx<r&&ly<r&&outside(lx,ly,r))return false;
    if(n&&e&&lx>15-r&&ly<r&&outside(15-lx,ly,r))return false;
    if(s&&w&&lx<r&&ly>15-r&&outside(lx,15-ly,r))return false;
    if(s&&e&&lx>15-r&&ly>15-r&&outside(15-lx,15-ly,r))return false;
    const bx=scallop(px+cy*2),by=scallop(py+cx*2+3);
    if(n&&ly<bx)return false; if(s&&15-ly<bx)return false;
    if(w&&lx<by)return false; if(e&&15-lx<by)return false;
    return true;
  }

let land=new Uint8ClampedArray(W*H*4),dist=new Float32Array(W*H),flowerCount=0,sig=-1;

function rebuild(){

          put(f.x,f.y+1,pa);put(f.x-1,f.y+1,pb);put(f.x+1,f.y-1,pb);put(f.x,f.y,pink?C.pinkEye:C.eye);}}

// ---- roads: cobblestone lanes link every building on an island to its nearest neighbours.

// pixels of the lane: an 8px band through each lane cell, joined to linked neighbours, plus door spurs
function paintRoads(G){

  for(let c=0;c<N*N;c++){if(!road[c])continue;const cx=c%N,cy=(c/N)|0,x0=cx*T,y0=cy*T;
    const n=cy>0&&roadLinks.has(rkey(c,c-N)),s=cy<N-1&&roadLinks.has(rkey(c,c+N)),

// ---- lanterns and bridges: they appear by themselves in good spots, 1 gold each (only while there is gold),
// and disappear, giving the gold back, once their spot is no longer good.

// the main (largest) island and another island, one bridge per island.
let lights=new Map(),bridges=new Map(),lastLight=0;

  const a=dir==='h'?w-1:w-N,b=dir==='h'?w+1:w+N;
  if(!grid[a]||!grid[b]||comp[a]===comp[b]||(comp[a]!==main&&comp[b]!==main))return null;

function updateLights(now){let ch=false;const main=mainComp();
  for(const[c]of[...lights])if(lightSpot(c)===null){lights.delete(c);refund(LIGHT_COST);ch=true;}
  for(const[w,b]of[...bridges])if(bridgeOK(w,b.dir,main)===null){bridges.delete(w);refund(LIGHT_COST);ch=true;}
  if(now-lastLight<2500||gold()<LIGHT_COST)return ch;
  // one new bridge or lantern at a time, so they pop up one by one
  const linked=new Set();for(const[w,b]of bridges){const o=bridgeOK(w,b.dir,main);if(o!==null)linked.add(o);}
  let pick=null;
  for(let w=0;w<N*N&&!pick;w++)for(const dir of['h','v']){const o=bridgeOK(w,dir,main);if(o===null||linked.has(o))continue;pick={w,dir};break;}

    splashes.push({x:(pick.w%N)*T+8,y:((pick.w/N)|0)*T+8,t:performance.now()});toast(tr(`A bridge was built (${LIGHT_COST} gold)`,`橋ができました（${LIGHT_COST}ゴールド）`));return true;}
  for(let c=0;c<N*N;c++){if(!road[c]||lights.has(c))continue;const lx=lightSpot(c);if(lx===null)continue;
    let ok=true;for(const k of lights.keys())if(cheb(k,c)<3){ok=false;break;}if(!ok)continue;
    lights.set(c,{t:now,lx});spend(LIGHT_COST);lastLight=now;toast(tr(`A lantern was lit (${LIGHT_COST} gold)`,`ランタンが灯りました（${LIGHT_COST}ゴールド）`));return true;}

// bridges are part of the ground layer: wooden planks over the water, posts down into the sea
function paintBridges(){const WD={d:[74,46,28],m:[138,90,54],l:[176,122,69],h:[217,176,122]};
  const put=(x,y,c)=>{if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;land[i]=c[0];land[i+1]=c[1];land[i+2]=c[2];land[i+3]=255;};
  for(const[w,b]of bridges){const cx=(w%N)*T,cy=((w/N)|0)*T;
    if(b.dir==='h'){const x0=cx-4,x1=cx+19,y0=cy+3,y1=cy+12;

const CAT_WALK=[ ['K.....K.K','K.....KKK','.KKKKKKEK','.KKKKKK..','.K.K..K.K'], ['K.....K.K','K.....KKK','.KKKKKKEK','.KKKKKK..','..K.K.K..'] ];
const CAT_SIT=['......K.K','K.....KKK','K.....KEK','.KKKKKK..','.KKKKKK..'];
const CAT_NAP=['......K.K','..KKKKKKK','.KKKKKKKK','KKKKKKKK.'];
const ZGLYPH=['####','..#.','.#..','####'];
let cats=new Map();
function updateCats(now,dt){
  for(const i of [...cats.keys()])if(!people.has(i)||!people.get(i).witch)cats.delete(i);
  for(const[i,p]of people){if(!p.witch)continue;
    if(!cats.has(i))cats.set(i,{x:p.x-.5,y:p.y+.1,face:1,mode:'sit',until:now+3000,step:0,born:now});
    const c=cats.get(i),mv=.7*dt/1000;
    if(c.mode==='nap'){if(now>=c.until){c.mode='sit';c.until=now+2000;}continue;}
    const tx=p.x-p.face*.55,ty=p.y+.15,dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
    if(d>.35){c.mode='walk';const nx=c.x+dx/d*Math.min(mv,d),ny=c.y+dy/d*Math.min(mv,d);
      if(solidAt(nx,ny)&&!solidAt(c.x,c.y)&&(c.stuck=(c.stuck||0)+dt)<2500)continue;c.stuck=0;c.x=nx;c.y=ny;c.step+=dt;if(Math.abs(dx)>.03)c.face=dx>0?1:-1;}
    else{if(c.mode==='walk'){c.mode='sit';c.until=now+2500+Math.random()*4000;}
      // often curls up for a snooze in the sun
      if(now>=c.until){if(Math.random()<.6){c.mode='nap';c.until=now+9000+Math.random()*12000;}else c.until=now+3000;}}}
}
function drawCat(c,ts,kp,now){
  const rows=c.mode==='nap'?CAT_NAP:c.mode==='walk'?CAT_WALK[Math.floor(c.step/150)%2]:CAT_SIT;
  const Wd=9,w=Wd*kp,h=rows.length*kp,ox=Math.round(c.x*ts-w/2),oy=Math.round(c.y*ts-h);
  const X=col=>ox+(c.face<0?Wd-1-col:col)*kp;
  tctx.globalAlpha=Math.min(1,(now-c.born)/900);
  tctx.fillStyle='rgba(20,40,30,.25)';tctx.fillRect(ox+kp,oy+h-kp/2,(Wd-2)*kp,kp);
  for(let r=0;r<rows.length;r++)for(let col=0;col<Wd;col++){const ch=rows[r][col];if(ch==='.')continue;
    tctx.fillStyle=ch==='E'?'#f2c94c':(r===0||rows[r-1][col]==='.')?'#4a4560':'#25222e';tctx.fillRect(X(col),oy+r*kp,kp,kp);}
  if(c.mode==='nap'){// three little z's drifting up from his head
    const zp=Math.max(1,Math.round(kp*.6)),hx=X(c.face<0?2:6);
    for(let n=0;n<3;n++){const t=((now/1000+n*.9)%2.7)/2.7,sz=Math.max(1,Math.round(zp*(.7+t*.8))),dir=c.face<0?-1:1;
      const zx=Math.round(hx+t*kp*5*dir),zy=Math.round(oy-kp-t*kp*7);
      tctx.globalAlpha=Math.min(1,(now-c.born)/900)*(t<.15?t/.15:t>.7?Math.max(0,(1-t)/.3):1);
      tctx.fillStyle='#22363d';for(let r=0;r<4;r++)for(let q=0;q<4;q++)if(ZGLYPH[r][q]==='#')tctx.fillRect(zx+q*sz-1,zy+r*sz-1,sz+2,sz+2);
      tctx.fillStyle='#fafaf0';for(let r=0;r<4;r++)for(let q=0;q<4;q++)if(ZGLYPH[r][q]==='#')tctx.fillRect(zx+q*sz,zy+r*sz,sz,sz);}}
  tctx.globalAlpha=1;}
// ---- the princess: steps out of the castle soon after the king and strolls about her town.
// Villagers she passes get a little heart above their heads.
// gold tiara with a pink gem, golden hair, purple gown with a gold-trimmed bodice and a darker hem
const PRINCESS_BODY=['.GTG.','YYYYY','YSSSY','YSSSY','YDKDY','SDDDS','DDDDD','dDDDd','ddddd'];
function princessLook(i){return{Y:'#f0bf3c',G:'#ffd23f',T:'#e8506a',S:SKIN[hash(i,15)%SKIN.length],D:'#9d6ad8',d:'#6c44a8',K:'#ffe08a',P:'#6c44a8',B:'#3f2a5e'};}
const HEART=['##.##','#####','.###.','..#..'];
const cellOf=q=>{const x=Math.floor(q.x),y=Math.floor(q.y-.05);return x>=0&&y>=0&&x<N&&y<N?y*N+x:-1;};
let princesses=new Map();
// she only walks on the cobblestone lanes: neighbours are lane cells the lane actually joins
const laneNb=c=>{const out=[],x=c%N,y=(c/N)|0;for(const[a,b]of D4){const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=N||ny>=N)continue;const c2=ny*N+nx;if(road[c2]&&roadLinks.has(rkey(c,c2)))out.push(c2);}return out;};
function lanePath(from,to){if(from===to)return[];const prev=new Int16Array(N*N).fill(-1);prev[from]=from;const q=[from];
  while(q.length){const j=q.shift();if(j===to)break;for(const r of laneNb(j))if(prev[r]<0){prev[r]=j;q.push(r);}}
  if(prev[to]<0)return null;const out=[];for(let j=to;j!==from;j=prev[j])out.push(j);return out.reverse();}
const laneSpot=j=>[j%N+.5,((j/N)|0)+.68];
function nearestLane(x,y,c){let best=-1,bd=1e9;for(let j=0;j<N*N;j++)if(road[j]&&comp[j]===c){const[lx,ly]=laneSpot(j),d=Math.hypot(lx-x,ly-y);if(d<bd){bd=d;best=j;}}return[best,bd];}
function updatePrincesses(now,dt){
  for(const i of [...princesses.keys()])if(!isCastle(houses.get(i))||!grid[i])princesses.delete(i);
  for(const[i,h]of houses){if(!isCastle(h)||!grid[i])continue;const since=now-(h.castle??h.t);
    if(!princesses.has(i)){if(since<4000||h.taken)continue;const fresh=since<9000;
      const gate=doorOf(i,h).cell,[sx,sy]=road[gate]?laneSpot(gate):[i%N+.5,((i/N)|0)+1.05];
      princesses.set(i,{x:sx,y:sy,path:[],wait:fresh?700:0,born:fresh?now:now-5000,face:-1,step:0,mode:'wander',
        look:princessLook(i),body:PRINCESS_BODY,princess:true,home:i});}
    const p=princesses.get(i),mv=WALK*.85*dt/1000;
    if(dragon)continue;
    if(p.wait>0)p.wait-=dt;
    else if(!p.path.length){// next stroll along the lanes: usually to the stretch nearest a villager, sometimes to any front door
      const c=comp[i],here=cellOf(p);
      if(here<0||!road[here]||Math.hypot(...laneSpot(here).map((v,k)=>v-(k?p.y:p.x)))>.2){
        // off the lane (or the lanes were just re-laid): step onto the nearest lane, otherwise wait by the gate
        const[j,d]=nearestLane(p.x,p.y,c);if(j>=0&&d<2.5)p.path=[laneSpot(j)];else p.wait=2500;}
      else{const vill=[...people.values()].filter(q=>!q.king&&cellOf(q)>=0&&comp[cellOf(q)]===c);let target=-1;
        if(vill.length&&Math.random()<.7){const q=vill[Math.floor(Math.random()*vill.length)];target=nearestLane(q.x,q.y,c)[0];}
        else{const doors=roadDoors.filter(e=>comp[e.cell]===c);if(doors.length)target=doors[Math.floor(Math.random()*doors.length)].cell;}
        const path=target>=0?lanePath(here,target):null;
        if(path&&path.length)p.path=path.map(laneSpot);else p.wait=1500+Math.random()*2000;}}
    else{const t=p.path[0],dx=t[0]-p.x,dy=t[1]-p.y,d=Math.hypot(dx,dy);
      if(Math.abs(dx)>.03)p.face=dx>0?1:-1;p.step+=dt;
      if(d<=mv){p.x=t[0];p.y=t[1];p.path.shift();if(!p.path.length){p.wait=1500+Math.random()*3500;p.step=0;}}
      else{p.x+=dx/d*mv;p.y+=dy/d*mv;}}
    for(const q of people.values()){if(q.king)continue;if(Math.hypot(q.x-p.x,q.y-p.y)<1.3&&now-(q.heart||0)>5000)q.heart=now;}
  }}
function drawHeart(p,ox,oy,kp,now){const age=now-p.heart;if(age>1800)return;
  const t=age/1800,hp=Math.max(1,Math.round(kp*.7)),hx=Math.round(ox+2.5*kp-2.5*hp),hy=Math.round(oy-hp*5-t*kp*3);
  const a=tctx.globalAlpha;tctx.globalAlpha=a*(t<.1?t/.1:t>.7?(1-t)/.3:1);
  tctx.fillStyle='#22363d';for(let r=0;r<4;r++)for(let c=0;c<5;c++)if(HEART[r][c]==='#')tctx.fillRect(hx+c*hp-1,hy+r*hp-1,hp+2,hp+2);
  for(let r=0;r<4;r++)for(let c=0;c<5;c++)if(HEART[r][c]==='#'){tctx.fillStyle=r===0&&(c===0||c===3)?'#f7a1b3':'#e8506a';tctx.fillRect(hx+c*hp,hy+r*hp,hp,hp);}
  tctx.globalAlpha=a;}

let dragon=null;
function maybeDragon(now,rolls){if(dragon||!princesses.size)return false;
  for(let r=0;r<rolls;r++)if(Math.random()<DRAGON_CHANCE){startDragon(now);return true;}return false;}
function startDragon(now){const keys=[...princesses.keys()];if(!keys.length)return;
  const key=keys[Math.floor(Math.random()*keys.length)],p=princesses.get(key);
  dragon={key,x:N+6,y:p.y-4,born:now,grabbed:false,carry:null,gx:0,gy:0};toast(tr('A dragon is coming!','ドラゴンがやってくる！'));}
function updateDragon(now,dt){if(!dragon)return;const d=dragon;d.x-=DRAGON_SPEED*dt/1000;
  if(!d.grabbed){const p=princesses.get(d.key);
    if(!p){d.grabbed=true;d.gx=d.x;d.gy=d.y;}
    else{const alt=Math.min(1,Math.max(0,(d.x-p.x)/5))*3.2;d.y=p.y-.95-alt;
      if(d.x<=p.x){// snatch her
        d.grabbed=true;d.carry=p;d.gx=d.x;d.gy=d.y;princesses.delete(d.key);
        const h=houses.get(d.key);if(h)houses.set(d.key,{...h,taken:now});
        p.face=-1;p.wait=1;p.heart=0;toast(tr('The dragon took the princess!','ドラゴンがお姫さまをさらっていきました！'));save();}}}
  else d.y=d.gy-Math.min(3.5,(d.gx-d.x)/4*3.5);
  if(d.carry){d.carry.x=d.x;d.carry.y=d.y+1.05;}
  if(d.x<-9)dragon=null;}
function dragonShadow(ts,now){if(!dragon)return;const d=dragon,cx=(d.x+1.2)*ts,cy=(d.carry?d.gy+.95+Math.min(3.5,(d.gx-d.x)/4*3.5):(princesses.get(d.key)?.y??d.y+4))*ts;
  const near=d.carry?Math.max(.35,1-(d.gx-d.x)/12):.6+.4*(1-Math.min(1,Math.max(0,(d.x-(princesses.get(d.key)?.x??d.x))/5)));
  tctx.fillStyle=`rgba(20,40,30,${.22*near})`;tctx.beginPath();tctx.ellipse(cx,cy,ts*2.4*near+ts,ts*.45*near+ts*.2,0,0,Math.PI*2);tctx.fill();}
function drawDragon(ts,kd,kp,now){if(!dragon||!dragonImg.complete)return;const d=dragon;
  if(d.carry)drawPerson(d.carry,ts,kp,now);
  const f=Math.floor((now-d.born)/DRAGON_FPS)%8,w=Math.round(DFW*kd),h=Math.round(DFH*kd);
  const ox=Math.round(d.x*ts-DCLAW_X*kd),oy=Math.round(d.y*ts-DCLAW_Y*kd);
  tctx.imageSmoothingEnabled=!Number.isInteger(kd);tctx.drawImage(dragonImg,f*DFW,0,DFW,DFH,ox,oy,w,h);tctx.imageSmoothingEnabled=false;}
const BANG=['#','#','#','.','#'];
function drawBang(ox,oy,kp,now){const hp=Math.max(1,Math.round(kp*.8)),bx=Math.round(ox+2*kp+(kp-hp)/2),by=Math.round(oy-hp*7-Math.abs(Math.sin(now/180))*kp);
  tctx.fillStyle='#22363d';for(let r=0;r<5;r++)if(BANG[r]==='#')tctx.fillRect(bx-1,by+r*hp-1,hp+2,hp+2);
  tctx.fillStyle='#ffd23f';for(let r=0;r<5;r++)if(BANG[r]==='#')tctx.fillRect(bx,by+r*hp,hp,hp);}

const TEXTS=[
 {id:'ophelia-goat',speaker:'Princess Ophelia',portrait:'ophelia',level:1,
  body:`Dear Aurelia,
How are you? I had a great time visiting your Kingdom last weekend. The chocolate eclairs your cook made were delicious! Father said we should steal the recipe for our cook. I think he was joking but you can never know. You know how I always wanted a pet? Well, I hoped for a horse or a cat. And guess what my father got me? A goat. I was so surprised. She’s really cute. My father says they can be very useful, you can even make cheese with goat milk. Well, I named her Lady. Next weekend you should come to meet her! We can even make cheese together.
See you soon,
Ophelia`,
  questions:[
   {id:'who-is-lady',q:'Who is Lady?',options:['The princess’s pet cat','The princess’s pet horse','princess’s pet goat','The other princess'],answer:2,
    why:'Ophelia writes that her father got her a goat, and then: “I named her Lady.” So Lady is her pet goat. A horse or a cat is what she hoped for, but not what she got.'},
   {id:'not-mentioned',q:'Which animal was not mentioned in the Princess’s letter?',options:['Horse','Goat','Dog','Cat'],answer:2,
    why:'The letter mentions a horse and a cat (the pets Ophelia hoped for) and a goat (the pet she got). A dog is never mentioned.'},
   {id:'last-weekend',q:'What did the Princess do last weekend?',options:['She got a pet goat.','She visited Princess Aurelia’s Kingdom.','She asked her father for a pet.','She made cheese with goat milk.'],answer:1,
    why:'The letter begins: “I had a great time visiting your Kingdom last weekend.” Making cheese is something she plans to do with Aurelia next weekend.'},
   {id:'steal-recipe',q:'Why did the King want to steal the recipe?',options:['Because the eclairs were delicious.','Because he wanted to visit Aurelia again.','Because he was joking.','Because he wanted to make cheese.'],answer:0,
    why:'Ophelia says the eclairs were delicious, and right after that: “Father said we should steal the recipe for our cook.” He wanted it because they tasted so good. Ophelia only thinks he might have been joking, which is not the reason he gave.'},
   {id:'next-weekend',q:'What should Aurelia do next weekend?',options:['Come to Ophelia’s kingdom to make eclairs.','Come to Ophelia’s kingdom to meet Lady.','Come to Aurelia’s Kingdom to make cheese.','Make goat’s cheese at home.'],answer:1,
    why:'Ophelia writes: “Next weekend you should come to meet her!” “Her” is Lady the goat, who lives with Ophelia, so Aurelia should come to Ophelia’s kingdom to meet Lady.'}
  ]},
 {id:'aurelia-reply',speaker:'Princess Aurelia',portrait:'aurelia',level:2,
  body:`Dear Ophelia,
I was very happy to read your last letter! I would love to meet your pet goat, Lady. I have some more chocolate eclairs to share with you. I can also give you the recipe. But I want your cook’s recipe for macaroons, too! I hope you don’t mind; I don’t want to make goat cheese with you. It sounds like a dirty activity and I don’t like to get dirty. How about we make some jewellery instead? I want a new necklace and earring set.
I will see you next weekend,
Aurelia`,
  questions:[
   {id:'two-wants',q:'What are the two things that Aurelia wants?',options:['Goats cheese and chocolate eclairs recipe.','New necklace and earring set and chocolate eclairs recipe.','New necklace and earring set and macaroons recipe.','New necklace and earring set and goat’s cheese.'],answer:2,
    why:'Aurelia writes: “I want your cook’s recipe for macaroons, too!” and “I want a new necklace and earring set.” The chocolate eclair recipe is something she is giving to Ophelia, not something she wants.'},
   {id:'not-like',q:'What does Aurelia not like?',options:['Getting dirty.','Eating goat’s cheese.','Making Jewellery.','Baking chocolate eclairs.'],answer:0,
    why:'Aurelia says making goat cheese “sounds like a dirty activity and I don’t like to get dirty.” She never says she dislikes eating goat’s cheese, and she is the one who suggests making jewellery.'},
   {id:'not-want',q:'What does Aurelia not want to do?',options:['Make goat’s cheese.','Eat a chocolate éclair.','Meet Lady.','Make jewellery.'],answer:0,
    why:'Aurelia writes: “I don’t want to make goat cheese with you.” She does want to meet Lady, share chocolate eclairs and make jewellery.'}
  ]},
 {id:'egor-eldoria',speaker:'King Egor',portrait:'egor',level:5,title:'The Kingdom of Eldoria',
  body:`The Kingdom of Eldoria was founded in 1066 by King Aldric the First, who united five small island villages under one crown. By 1730, the kingdom had grown to a population of 85,000 people, with approximately three-fifths living in farming villages, a quarter living in fishing communities, and the remaining three-twentieths working in forestry, trade, and other industries. Wheat farming provides just over a third of the kingdom’s annual income, while fishing contributes three-tenths of its exports and provides jobs for nearly one-fifth of the population. Wood cutting supplies a quarter of the kingdom’s building materials and supports shipbuilding, construction, and trade with neighbouring lands. Together, these industries have helped Eldoria develop a stronger economy, with its wealth increasing by approximately seven-tenths between 1500 and 1730. However, the kingdom faces several serious threats, including deforestation caused by excessive wood cutting, rising water levels that have caused some smaller islands to suddenly sink beneath the sea, and a temperamental witch who lives alone on a distant island and occasionally threatens passing sailors. Although many people fear that a mighty dragon lives in the mountains, historical records show no evidence of its existence, suggesting that the creature is simply a myth rather than a real threat to the kingdom.`,
  questions:[
   {id:'founded',q:'When was the Kingdom of Eldoria founded?',options:['1500','1066','1730','1600'],answer:1,
    why:'The text begins: “The Kingdom of Eldoria was founded in 1066 by King Aldric the First.” The years 1500 and 1730 come later, when the text describes how the kingdom grew.'},
   {id:'most-live',q:'Where do most people in Eldoria live?',options:['In fishing communities','In forests','In farming villages','On the witch\'s island'],answer:2,
    why:'About three-fifths of the people live in farming villages. That is more than the quarter who live in fishing communities or the three-twentieths who work in forestry and trade.'},
   {id:'wheat',q:'How much of the kingdom\'s annual income comes from wheat farming?',options:['Exactly half','About one-tenth','Just over a third','Nearly three-quarters'],answer:2,
    why:'The text says: “Wheat farming provides just over a third of the kingdom’s annual income.”'},
   {id:'real-threat',q:'Which of the following is a real threat to Eldoria?',options:['The dragon living in the mountains','Deforestation caused by excessive wood cutting','The king uniting the five villages','The growth of the fishing industry'],answer:1,
    why:'Deforestation caused by excessive wood cutting is listed as one of the kingdom’s serious threats. The dragon is said to be a myth, and uniting the villages and growing the fishing industry helped the kingdom.'},
   {id:'dragon',q:'Why is the dragon not considered a real threat to Eldoria?',options:['The king has defeated it.','It lives on the witch\'s island.','Historical records show that it left the kingdom in 1500.','There is no evidence that it exists, so it is considered a myth.'],answer:3,
    why:'The text says “historical records show no evidence of its existence”, so the dragon is “simply a myth rather than a real threat to the kingdom.”'}
  ]},
 {id:'leviathan-lumaria',speaker:'King Leviathan',portrait:'leviathan',level:5,title:'The Kingdom of Lumaria',
  body:`The Kingdom of Lumaria launched a new initiative called the Young Knights Programme in 1725 to help young students learn skills and prepare for permanent employment. Students aged 13 to 18 can study history, mathematics, first aid, teamwork, leadership, and how to care for horses. They also complete practical training with experienced royal staff. The programme has many benefits, including increased confidence, improved problem-solving skills, and better employment opportunities. Research by the OECD shows that in 2022, the employment rate for young adults aged 25–34 with vocational qualifications was approximately 83%, compared with 73% for those with general qualifications. This suggests that practical training can help increase employment and decrease the risk of unemployment. Lumaria hopes that at least 75% of students who complete the programme will find permanent employment in the royal guard, castle administration, or public services within two years. However, there are also some demerits. Training requires a lot of time and money, and students may have less time for other subjects. Furthermore, not every student will want to become a knight after graduation. Despite these challenges, the king believes that the initiative will strengthen the kingdom by giving young people useful skills and a clearer path towards their future careers.`,
  questions:[
   {id:'who-join',q:'Who can join the Young Knights Programme?',options:['Children aged 5 to 10','Adults aged 25 to 34','Students aged 13 to 18','Only experienced knights'],answer:2,
    why:'The text says “Students aged 13 to 18 can study” on the programme. The ages 25–34 describe the young adults in the OECD research, and experienced royal staff are the people who train the students.'},
   {id:'rate-2022',q:'According to the research mentioned in the text, what was the employment rate for young adults with vocational qualifications in 2022?',options:['Approximately 73%','Approximately 50%','Approximately 83%','Approximately 95%'],answer:2,
    why:'The OECD research found that in 2022 the employment rate for young adults with vocational qualifications was “approximately 83%”. The 73% figure is for those with general qualifications.'},
   {id:'practical',q:'What does the research suggest about practical training?',options:['It can help increase employment opportunities.','It guarantees a job for every student.','It makes all general education unnecessary.','It causes unemployment to increase.'],answer:0,
    why:'The text says the research “suggests that practical training can help increase employment and decrease the risk of unemployment.” It helps, but it does not guarantee a job for everyone.'},
   {id:'demerit',q:'Which of the following is a possible demerit of the programme?',options:['Students cannot learn teamwork.','It may cost a lot of money and take up time.','It decreases every student\'s confidence.','It prevents students from learning first aid.'],answer:1,
    why:'The demerits listed are that “training requires a lot of time and money” and students may have less time for other subjects. Teamwork and first aid are taught on the programme, and it increases confidence.'},
   {id:'guarantee',q:'Does completing the Young Knights Programme guarantee permanent employment?',options:['Yes, every student gets a job.','Yes, but only in the royal guard.','No, the kingdom hopes that 75% will find permanent employment.','No, the programme does not teach any useful skills.'],answer:2,
    why:'Lumaria only “hopes that at least 75%” of students will find permanent employment, so a job is not guaranteed. The programme does teach useful skills.'}
  ]},
 {id:"recipe-stew",speaker:'Rina the Baker',portrait:'baker',level:4,title:"Venison Stew",
  body:"Makes 4 servings\n\nIngredients:\n- 500g venison (deer meat)\n- 2 carrots\n- 2 potatoes\n- 1 onion\n- 500ml beef stock\n- 1 tablespoon flour\n- 1 tablespoon oil\n- Salt and pepper\nInstructions:\n1. Cut the meat and vegetables into small pieces.\n2. Heat the oil in a large pot. Cook the meat for 5 minutes.\n3. Add the onion, carrots, and potatoes.\n4. Mix in the flour and beef stock.\n5. Add salt and pepper.\n6. Cover the pot and cook on low heat for 90 minutes, until the meat is tender.",

 {id:"recipe-hotcakes",speaker:'Rina the Baker',portrait:'baker',level:4,title:"Hot Cakes",
  body:"Makes 8 hot cakes\n\nIngredients:\n- 150g flour\n- 1 egg\n- 200ml milk\n- 1 tablespoon sugar\n- 1 teaspoon baking powder\n- A little butter\nInstructions:\n1. Put the flour, sugar, and baking powder in a bowl.\n2. Add the egg and milk. Mix well.\n3. Heat a little butter in a frying pan.\n4. Pour some mixture into the pan.\n5. Cook for 2 minutes on each side.\n6. Serve with honey or fruit.",

 {id:"recipe-eclairs",speaker:'Rina the Baker',portrait:'baker',level:4,title:"Chocolate Éclairs",
  body:"Makes 6 éclairs\n\nIngredients:\n- 100g flour\n- 50g butter\n- 150ml water\n- 2 eggs\n- 200ml whipped cream\n- 100g chocolate\nInstructions:\n1. Heat the water and butter in a pot until the butter melts.\n2. Add the flour and mix well.\n3. Let the mixture cool. Add the eggs and stir.\n4. Put the mixture into long shapes on a baking tray.\n5. Bake at 200°C for 25 minutes. Ask an adult for help with the oven.\n6. Let the éclairs cool. Fill them with whipped cream.\n7. Melt the chocolate and pour it over the éclairs.",

 {id:"recipe-pie",speaker:'Rina the Baker',portrait:'baker',level:4,title:"Pumpkin Pie",

 {id:"recipe-macaroons",speaker:'Rina the Baker',portrait:'baker',level:4,title:"Coconut Macaroons",

 {id:"hazel-dragon",speaker:'Hazel the Witch',portrait:'hazel',level:3,title:"The Princess and My Dragon",
  body:"Dear Diary, One morning, I visited my pet dragon, Meldicore. He was very sad because Princess Aurelia had not visited him for three days. Meldicore thinks the princess is his best friend, but she was busy studying for her exams. I decided to help him, so I flew to the castle on my broomstick. I found Aurelia in the library and invited her to visit Meldicore. She agreed, and we returned to the tower together. Meldicore was so happy that he gave Aurelia his favourite shiny rock!",

 {id:"hazel-knight",speaker:'Hazel the Witch',portrait:'hazel',level:3,title:"The Knight I Rather Like",
  body:"Dear Diary, I have a small problem. I rather like Sir Chad, a handsome knight who often drinks at the tavern. Last Tuesday, Princess Ophelia disappeared from the royal garden. The king immediately asked Sir Chad to rescue her. I secretly followed him on my broom because I wanted to see him in action. We found the princess trapped inside a dark cave. A giant spider was guarding the entrance, so I used a spell to make it fall asleep. Sir Chad carried the princess out of the cave, and everyone celebrated at the castle that evening. Sadly, he was too busy talking to the princess to notice me!",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Hazel used a spell to make the giant spider fall asleep.", "The king asked Sir Chad to rescue Princess Ophelia.", "Everyone celebrated at the castle.", "Hazel followed Sir Chad on her broom.", "Sir Chad defeated a dragon and took its treasure."],order:[1, 3, 0, 2],notIn:4,
    why:"The king asked Sir Chad to rescue the princess (B), then Hazel secretly followed him on her broom (D). At the cave she put the giant spider to sleep with a spell (A), and that evening everyone celebrated at the castle (C). There was no dragon in this story (E)."}

 {id:"hazel-pies",speaker:'Hazel the Witch',portrait:'hazel',level:3,title:"The King’s Very Long History Lesson",
  body:"Dear Diary, my wonderful best friend is a baker named Rina. Unfortunately, our king, Egor, loves history so much that he sometimes forgets to eat! One morning, Rina baked twenty delicious apple pies for the royal festival. I took a basket of pies to the castle, but King Egor was giving a three-hour lesson about ancient kings. While we waited, my cheeky cat, Fifi, jumped onto the table and ate two pies. The king finally finished his lesson and came into the kitchen. He was delighted by Rina's baking and asked her to make another twenty pies for the next festival. Fifi pretended to be asleep, but I knew exactly what she had done!",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Fifi jumped onto the table and ate two pies.", "King Egor asked Rina to bake more pies.", "Rina baked twenty apple pies for the festival.", "Hazel took a basket of pies to the castle.", "The king went outside to practice sword fighting."],order:[2, 3, 0, 1],notIn:4,
    why:"Rina baked the pies first (C), then Hazel took a basket of them to the castle (D). While they waited for the king’s lesson to end, Fifi ate two pies (A). Finally the king asked Rina to bake more (B). The king was giving a history lesson, not practising sword fighting (E)."}

 {id:"hazel-wand",speaker:'Hazel the Witch',portrait:'hazel',level:3,title:"Fifi’s Terrible Secret",
  body:"Dear Diary, my cat, Fifi, is very cheeky and loves stealing things. One afternoon, I discovered that my magic wand was missing. I searched my bedroom, my kitchen, and even the garden, but I could not find it anywhere. Then I noticed a trail of glitter leading towards the bakery. My best friend Rina, the baker, was standing outside her shop with Fifi sitting on her head! I asked Fifi where my wand was, and she jumped down and ran behind a flour barrel. There, hidden beneath a bag of flour, was my missing wand. I took it home and promised to keep it somewhere safer next time.",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Hazel found her wand beneath a bag of flour.", "Hazel searched her bedroom, kitchen, and garden.", "Hazel noticed a trail of glitter leading towards the bakery.", "Hazel discovered that her magic wand was missing.", "Rina gave Hazel's wand to the king as a birthday present."],order:[3, 1, 2, 0],notIn:4,
    why:"Hazel first discovered her wand was missing (D), then searched her bedroom, kitchen and garden (B). Next she noticed the trail of glitter leading to the bakery (C), and finally found the wand under a bag of flour (A). Rina never gave the wand to the king (E)."}
  ]},
 {id:"hazel-lesson",speaker:'Hazel the Witch',portrait:'hazel',level:3,title:"The Princess Who Visited My Tower",
  body:"Dear Diary, today Princess Aurelia arrived in a little boat on my Island. She told me that she wanted to learn magic, but her father, King Egor, said that magic was too dangerous. I agreed to teach her three simple spells. First, I showed her how to make a flower glow. Next, I taught her how to turn a stone into a butterfly. Finally, we tried to make a cup of tea appear from thin air, but I accidentally created fifty cups instead! We laughed so much that we nearly fell off our chairs. Before she left, Aurelia promised to visit me again next month. I think she will make a wonderful witch one day.",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Hazel taught Aurelia how to turn a stone into a butterfly.", "Aurelia promised to visit Hazel again next month.", "Princess Aurelia arrived at Hazel’s Island in a boat.", "Hazel accidentally created fifty cups of tea.", "Aurelia flew home on a golden dragon."],order:[2, 0, 3, 1],notIn:4,
    why:"Aurelia arrived by boat first (C). Hazel then taught her to turn a stone into a butterfly (A), and after that accidentally made fifty cups of tea (D). Before leaving, Aurelia promised to visit again (B). She came and went by boat, not on a golden dragon (E)."}
  ]},
 {id:"chad-princess",speaker:'Sir Chad',portrait:'chad',level:3,title:"The Missing Princess",
  body:"Dear Diary,\n\nBro, you will NOT believe what happened yesterday. King Egor called me to the castle because Princess Aurelia was missing! He asked ME to find her because, obviously, I'm the bravest knight around. I climbed onto Vader, but he walked away from me. LOL. I guess he was just excited for our adventure!\n\nWe rode into the forest, and I found Aurelia sitting by a river with Hazel the witch. Ngl, Hazel looked pretty cute today. She smiled at me, so I think she's totally into me. Aurelia said she went to collect flowers but got lost. I helped her get back to the castle, and King Egor gave me a silver sword. What a day! Hazel left without saying goodbye, but she's probably just shy around handsome guys like me.",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Chad found Princess Aurelia by a river with Hazel.", "King Egor gave Chad a silver sword.", "King Egor asked Chad to find his daughter.", "Chad rode into the forest on Vader.", "Princess Aurelia flew home on Meldicore's back."],order:[2, 3, 0, 1],notIn:4,
    why:"King Egor asked Sir Chad to find Aurelia (C), so he rode into the forest on Vader (D) and found her by the river with Hazel (A). Back at the castle, the king gave him a silver sword (B). Chad helped Aurelia home himself: she never flew on Meldicore (E)."}
  ]},
 {id:"chad-dragon",speaker:'Sir Chad',portrait:'chad',level:3,title:"The Dragon's Best Friend",
  body:"Dear Diary,\n\nDude, this morning I heard a dragon crying outside Princess Ophelia's window. It was Meldicore, Hazel's pet dragon. He was sad because Ophelia had gone to visit her dad, King Leviathan. Meldicore thinks Ophelia is his BFF, so he was acting like she'd left him forever. So dramatic, bro.\n\nI decided to help and wrote Ophelia a letter. Then I rode Vader to King Leviathan's castle to deliver it. Well, I TRIED to ride Vader. He refused to move, so I had to walk beside him. What a lazy guy.\n\nOphelia said she'd come back the next day. When she returned, Meldicore got so excited that he accidentally set a tree on fire! I put it out with a bucket of water. Hazel was there too, and she laughed when she saw my wet clothes. She was probably laughing because I'm so charming. That's my theory, anyway.",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Ophelia returned, and Meldicore accidentally set a tree on fire.", "Chad delivered a letter to King Leviathan's castle.", "Chad put out the fire with a bucket of water.", "Meldicore cried outside Princess Ophelia's window.", "King Leviathan asked Chad to teach Meldicore to swim."],order:[3, 1, 0, 2],notIn:4,
    why:"First Meldicore cried outside Ophelia's window (D). Sir Chad then delivered a letter to King Leviathan's castle (B). When Ophelia came back, Meldicore set a tree on fire (A), and Chad put it out with a bucket of water (C). Nobody asked him to teach Meldicore to swim (E)."}
  ]},
 {id:"chad-party",speaker:'Sir Chad',portrait:'chad',level:3,title:"The King's Big Mistake",
  body:"Dear Diary,\n\nBro, King Egor is actually obsessed with history. Today, he called me to the castle library to find an old book about famous knights. I told him we could look later, but he started talking about ancient swords for like an hour. My guy seriously needs a hobby.\n\nI decided to visit Rina the baker and ask her to make bread and cakes for the royal party. While she was baking, Hazel came in with her cat, Fifi. That little menace jumped onto the counter and stole a whole cake! Rina chased her around the shop while I tried to catch her. I was basically a hero, as usual.\n\nThen Vader walked into the bakery and started eating flour from an open bag. I told him to stop, but he turned around and ignored me. He's probably jealous of my amazing leadership skills. Anyway, we saved enough food for the party, and King Egor thanked us. Hazel smiled at me. I'm telling you, bro, we're basically meant to be.",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Fifi stole a cake from Rina's counter.", "Chad asked Rina to make bread and cakes.", "King Egor asked Chad to find an old history book.", "They saved enough food for the royal party.", "Chad travelled to a distant island to fight a sea monster."],order:[2, 1, 0, 3],notIn:4,
    why:"King Egor first asked Sir Chad to find an old book (C). Chad then asked Rina to bake bread and cakes (B). While she was baking, Fifi stole a cake (A), but in the end they saved enough food for the party (D). There was no sea monster in this story (E)."}
  ]},
 {id:"chad-wand",speaker:'Sir Chad',portrait:'chad',level:3,title:"Hazel's Missing Wand",
  body:"Dear Diary,\n\nOkay, bro, today was actually pretty wild. Hazel came to the castle because she'd lost her magic wand. She looked worried, so I offered to help. She said, “Thanks, Chad.” Just Chad? Not “Sir Chad, the handsome knight”? Interesting. Maybe she's nervous around me.\n\nI searched the castle halls, but I couldn't find the wand. Then I saw Fifi hiding behind a curtain. That cheeky cat had Hazel's wand and was using it to make little flowers appear! I took it from Fifi and gave it back to Hazel.\n\nHazel was super happy and gave me a bottle of magic potion. She told me NOT to drink it because it might turn me into a frog. I laughed and said nothing could make me less handsome. She didn't laugh. Tough crowd, bro.\n\nWhen I tried to leave, Vader refused to let me climb onto his back. I had to walk home. Hazel suggested I enjoy the moonlight. See? She cares about me. I'm choosing to believe that.",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["Hazel gave Chad a bottle of magic potion.", "Chad found Fifi hiding behind a curtain with the wand.", "Hazel asked Chad to find her missing magic wand.", "Chad returned the wand to Hazel.", "Chad used the wand to turn King Leviathan into a frog."],order:[2, 1, 3, 0],notIn:4,
    why:"Hazel came looking for her missing wand (C). Sir Chad found Fifi hiding behind a curtain with it (B) and gave it back to Hazel (D). To thank him, Hazel gave him a bottle of magic potion (A). Only the potion might turn someone into a frog, and nobody turned King Leviathan into one (E)."}
  ]},
 {id:"chad-race",speaker:'Sir Chad',portrait:'chad',level:3,title:"The Royal Horse Race",
  body:"Dear Diary,\n\nToday was the royal horse race, and I was SO ready to win. King Leviathan organised the race, and Hazel was watching from the crowd. I polished my armour and practised my best smile. I mean, if I'm going to win a race, I might as well look good doing it, right?\n\nPrincess Ophelia waved a flag to start the race, and I rode Vader towards the finish line. We were doing great until Vader suddenly stopped to eat grass. BRO. WE WERE IN A RACE.\n\nI told him to keep going, but he ignored me. I said to the crowd that he was saving his energy for an epic finish. Another knight passed us, and I came second. Honestly, still pretty good.\n\nKing Leviathan gave me a golden medal for being a good sport. Hazel covered her face with her hands when I told her about the race. She was probably overwhelmed by my amazing skills. Vader walked away before I could congratulate him. That horse seriously needs to work on his attitude.\n\nNext time, I'm feeding him BEFORE the race. Easy fix, bro.",
  questions:[
   {id:'order',type:'order',points:1,q:"Put the events in the correct order. One of them is not in the story.",events:["King Leviathan gave Chad a golden medal.", "Vader stopped to eat grass during the race.", "Princess Ophelia waved a flag to start the race.", "Chad rode Vader towards the finish line.", "Chad won the race and received a golden crown."],order:[2, 3, 1, 0],notIn:4,
    why:"Princess Ophelia started the race with her flag (C), and Sir Chad rode Vader towards the finish line (D) until Vader stopped to eat grass (B). After the race, King Leviathan gave him a golden medal (A). Chad came second, so he did not win a golden crown (E)."}
  ]}

const ITEMS=new Map();for(const t of TEXTS)for(const q of t.questions)ITEMS.set(t.id+'/'+q.id,{t,q});
let earned=0,spent=0,Q={answered:[],cooling:{},pile:[],nextVisit:4000,welcomed:false};
try{const g=JSON.parse(localStorage.getItem('tidewater-gold-v2')||'null');if(g){earned=+g.earned||0;spent=+g.spent||0;}
  const q=JSON.parse(localStorage.getItem('tidewater-quiz-v2')||'null');if(q)Q={...Q,...q};}catch(e){}
Q.pile=Q.pile.filter(k=>ITEMS.has(k));
const gold=()=>earned-spent;
function saveQuiz(){try{localStorage.setItem('tidewater-gold-v2',JSON.stringify({earned,spent}));localStorage.setItem('tidewater-quiz-v2',JSON.stringify(Q));}catch(e){}}
let lastGold=null;function goldUI(){const g=gold(),e=$('sGold');if(e)e.textContent=g;const n=$('goldN');if(n)n.textContent=g;
  const t=$('goldTab');if(t&&lastGold!==null&&g>lastGold){t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump');}lastGold=g;}
function spend(n){spent+=n;goldUI();saveQuiz();}
// sinking gives back what was paid: 1 per land tile plus whatever the building on it cost (3 for a house, +5 for an upgrade, +10 for a castle)
const housePaid=h=>h.paid??((h.v>=5&&h.v<=9)||h.v===CASTLE?2:1);
function refund(n){if(n>0){spent-=n;goldUI();saveQuiz();}}
function noGold(msg){toast(LANG==='ja'?(msg?msg+'。':'ゴールドが足りません。')+'手紙を読んでゴールドをかせぎましょう！':(msg?msg+'. ':'Not enough gold. ')+'Read a letter to earn more!');const b=$('lettersBtn');if(!b.hidden){b.classList.remove('new');void b.offsetWidth;b.classList.add('new');}}
function pay(n=COST,msg){if(gold()<n){noGold(msg||null);return false;}spend(n);return true;}
// letters arrive at random moments of play, 1 to 5 at a time
function pool(){const out=[];for(const k of ITEMS.keys()){if(Q.answered.includes(k)||Q.pile.includes(k))continue;if((Q.cooling[k]||0)>played)continue;out.push(k);}return out;}
// a new batch every 30 to 90 seconds of play; sooner (15 s) when the pile is empty
function visit(){const av=pool();Q.nextVisit=played+(Q.pile.length?30000+Math.random()*60000:15000+Math.random()*15000);
  if(!av.length){Q.nextVisit=played+15000;saveQuiz();return;}
  for(let i=av.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[av[i],av[j]]=[av[j],av[i]];}
  const n=Math.min(1+Math.floor(Math.random()*5),av.length,PILE_MAX-Q.pile.length);if(n<=0){saveQuiz();return;}
  const got=av.slice(0,n);Q.pile.push(...got);saveQuiz();lettersUI(true);
  const who=ITEMS.get(got[0]).t.speaker;toast(n===1?tr(`A letter from ${who} has arrived!`,`${who}から手紙が届きました！`):tr(`${n} letters have arrived!`,`手紙が${n}通届きました！`));}
function checkVisits(){if(!sheetOpen&&played>=Q.nextVisit)visit();}
function lettersUI(bump){if(!Q.pile.length&&Q.nextVisit>played+20000)Q.nextVisit=played+15000+Math.random()*5000;   // all read: the next ones come soon
  const b=$('lettersBtn');$('lettersN').textContent=Q.pile.length;b.hidden=sheetOpen||!Q.pile.length;
  if(bump&&!b.hidden){b.classList.remove('new');void b.offsetWidth;b.classList.add('new');}}
// the reading panel: welcome -> read (30 s, can skip, can't go back) -> question -> right / wrong (explanation locked 10 s)
let sheetOpen=false,stage=null,readT=0,lockT=0,cur=null;
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openSheet(){sheetOpen=true;$('sheet').hidden=false;lettersUI();}
function closeSheet(){if(stage==='wrong'&&Date.now()<lockT)return;sheetOpen=false;stage=null;cur=null;clearInterval(readT);$('sheet').hidden=true;lettersUI();}
function setHead(who,lvl,portrait){$('qClose').disabled=false;$('qWho').textContent=who;$('qLvl').hidden=true;   // level and reward are not shown to the player
  
  const im=$('qPortrait');if(portrait&&PORTRAITS[portrait]){im.onload=()=>im.style.setProperty('--pw',(im.naturalWidth/im.naturalHeight)/(99/176));im.src=PORTRAITS[portrait];im.hidden=false;}else im.hidden=true;}
function showWelcome(){openSheet();stage='welcome';setHead(tr('Welcome to Tidewater Isles','Tidewater Islesへようこそ'),'',null);
  $('qBody').innerHTML=LANG==='ja'?`<p>島づくりにはゴールドが必要です。土地1マスは<b>1ゴールド</b>、新しい家は<b>3</b>、家の増築は<b>5</b>ゴールドです。ランタンと橋（各1ゴールド）とお城（10ゴールド）は、ゴールドがあると自然にできます。土地をしずめるとゴールドが戻ります。</p>
   <p>ゴールドをかせぐには、王国の人たちから届く手紙を読みましょう。手紙は英語で書かれていて、それぞれに問題があります。正解するとゴールドがもらえます。</p>

const WHY_JA={"ophelia-goat/who-is-lady": "オフィーリアは、お父さんがヤギを買ってくれたと書いたあとに “I named her Lady.” と書いています。つまり、レディはペットのヤギです。馬やネコは彼女がほしかったペットで、実際にもらったペットではありません。", "ophelia-goat/not-mentioned": "手紙には、馬とネコ（オフィーリアがほしかったペット）とヤギ（実際にもらったペット）が出てきます。イヌは一度も出てきません。", "ophelia-goat/last-weekend": "手紙は “I had a great time visiting your Kingdom last weekend.” で始まります。チーズ作りは、来週末にアウレリアとしようと考えていることです。", "ophelia-goat/steal-recipe": "オフィーリアはエクレアがとてもおいしかったと書き、そのすぐあとに “Father said we should steal the recipe for our cook.” と書いています。とてもおいしかったから、レシピがほしかったのです。「冗談だったかもしれない」というのはオフィーリアの考えで、お父さんが言った理由ではありません。", "ophelia-goat/next-weekend": "オフィーリアは “Next weekend you should come to meet her!” と書いています。“her” はヤギのレディのことで、レディはオフィーリアのところにいます。だから、アウレリアがオフィーリアの王国へ会いに行くのです。", "aurelia-reply/two-wants": "アウレリアは “I want your cook’s recipe for macaroons, too!” と “I want a new necklace and earring set.” と書いています。チョコレートエクレアのレシピは、アウレリアがオフィーリアにあげるもので、アウレリアがほしいものではありません。", "aurelia-reply/not-like": "アウレリアは、ヤギのチーズ作りは “sounds like a dirty activity and I don’t like to get dirty.” と言っています。ヤギのチーズを食べるのがきらいとは言っていませんし、アクセサリー作りを提案したのはアウレリア自身です。", "aurelia-reply/not-want": "アウレリアは “I don’t want to make goat cheese with you.” と書いています。レディに会うこと、チョコレートエクレアを分けること、アクセサリーを作ることはしたいと思っています。", "egor-eldoria/founded": "本文は “The Kingdom of Eldoria was founded in 1066 by King Aldric the First.” で始まります。1500年と1730年は、そのあと王国が大きくなっていく様子を説明するところに出てくる年です。", "egor-eldoria/most-live": "人々の約5分の3（three-fifths）が農村に住んでいます。これは、漁村に住む4分の1（a quarter）や、林業や商業で働く20分の3（three-twentieths）より多いです。", "egor-eldoria/wheat": "本文に “Wheat farming provides just over a third of the kingdom’s annual income.” とあります。小麦の農業は、王国の年間収入の3分の1より少し多くをしめています。", "egor-eldoria/real-threat": "木の切りすぎによる森林破壊（deforestation）は、王国の深刻な問題の1つとして書かれています。ドラゴンは伝説（myth）だと書かれていて、村の統一や漁業の成長は王国のためになったことです。", "egor-eldoria/dragon": "本文には “historical records show no evidence of its existence” とあるので、ドラゴンは “simply a myth rather than a real threat to the kingdom.” です。", "leviathan-lumaria/who-join": "本文に “Students aged 13 to 18 can study” とあります。25〜34歳はOECDの調査に出てくる若者の年れいで、経験のある王室スタッフは学生を教える人たちです。", "leviathan-lumaria/rate-2022": "OECDの調査によると、2022年に職業資格を持つ若者の就業率は “approximately 83%” でした。73%は一般的な資格を持つ若者の数字です。", "leviathan-lumaria/practical": "本文には、調査は “suggests that practical training can help increase employment and decrease the risk of unemployment.” とあります。実践的な訓練は役に立ちますが、全員の仕事を保証するものではありません。", "leviathan-lumaria/demerit": "デメリットとして書かれているのは “training requires a lot of time and money” ことと、ほかの教科の時間が少なくなるかもしれないことです。チームワークや応急手当はプログラムで学ぶことで、自信も高まります。", "leviathan-lumaria/guarantee": "ルマリアは学生の “at least 75%” が正社員の仕事を見つけることを “hopes” しているだけなので、仕事は保証されていません。役に立つ技術を学べるのは本当です。", "recipe-stew/potatoes": "材料リストに “2 potatoes” とあります。このレシピは4人分ですが、それは何人分かという数で、ジャガイモの数ではありません。", "recipe-stew/cook-time": "手順6に “Cover the pot and cook on low heat for 90 minutes.” とあります。手順2の5分は、最初に肉に焼き色をつける時間です。", "recipe-hotcakes/milk": "材料リストに “200ml milk” とあります。150gは小麦粉の量です。", "recipe-hotcakes/before-pour": "手順3は “Heat a little butter in a frying pan”、手順4は “Pour some mixture into the pan” なので、バターが先です。焼くことと盛りつけることは、生地をフライパンに入れたあとです。", "recipe-eclairs/eggs": "材料リストに “2 eggs” とあります。このレシピでエクレアは6個できますが、卵は2個でいいのです。", "recipe-eclairs/before-cream": "手順6に “Let the éclairs cool. Fill them with whipped cream.” とあります。まず冷まさなければいけません。チョコレートは最後の手順7でかけます。", "recipe-pie/puree": "材料リストに “300g pumpkin purée” とあります。100gは砂糖、180はオーブンの温度、40は焼く時間（分）です。", "recipe-pie/after-bake": "焼くのは手順5です。焼いたあとの手順6に “Let the pie cool before serving.” とあります。ほかの選択肢は、どれもパイをオーブンに入れる前のことです。", "recipe-macaroons/coconut": "材料リストに “150g desiccated coconut” とあります。100gは砂糖、170はオーブンの温度、12はできあがるマカロンの数です。", "recipe-macaroons/colour": "手順6に、“for 15 minutes until golden brown” 焼くと書いてあります。", "hazel-dragon/order": "まずヘーゼルはメルディコアに会いに行き、彼が悲しんでいるのを見つけました（C）。次にほうきでお城へ飛んでいき（D）、アウレリアをさそいました（A）。最後に、メルディコアはアウレリアにお気に入りのピカピカの石をあげました（B）。アウレリアがメルディコアに金のかんむりをあげたことはありません（E）。", "hazel-knight/order": "王さまがチャド卿にお姫さまを助けるようたのみ（B）、ヘーゼルはこっそりほうきで彼のあとを追いました（D）。どうくつで、ヘーゼルは呪文で大グモをねむらせ（A）、その夜みんなでお城でお祝いしました（C）。この話にドラゴンは出てきません（E）。", "hazel-pies/order": "まずリナがパイを焼き（C）、ヘーゼルがそのパイをかごに入れてお城へ持っていきました（D）。王さまの授業が終わるのを待っている間に、フィフィがパイを2つ食べました（A）。最後に、王さまはリナにもっとパイを焼くようたのみました（B）。王さまがしていたのは歴史の授業で、剣の練習ではありません（E）。", "hazel-wand/order": "ヘーゼルはまず魔法のつえがないことに気づき（D）、寝室・台所・庭をさがしました（B）。次にパン屋へ続くキラキラの跡を見つけ（C）、最後に小麦粉のふくろの下でつえを見つけました（A）。リナがつえを王さまにあげたことはありません（E）。", "hazel-lesson/order": "まずアウレリアがボートでやってきました（C）。ヘーゼルは石をチョウに変える方法を教え（A）、そのあとうっかり紅茶を50杯も出してしまいました（D）。帰る前に、アウレリアはまた来ると約束しました（B）。アウレリアはボートで来て帰ったので、金のドラゴンには乗っていません（E）。", "chad-princess/order": "エゴール王がチャド卿にアウレリアをさがすようたのんだので（C）、彼はベイダーに乗って森へ行き（D）、川のそばでヘーゼルといっしょにいるアウレリアを見つけました（A）。お城にもどると、王さまは彼に銀の剣をあげました（B）。アウレリアを連れて帰ったのはチャドで、彼女はメルディコアに乗っていません（E）。", "chad-dragon/order": "まずメルディコアがオフィーリアの窓の外で泣いていました（D）。次にチャド卿はリヴァイアサン王のお城へ手紙を届けました（B）。オフィーリアが帰ってくると、メルディコアが木に火をつけてしまい（A）、チャドがバケツの水で火を消しました（C）。メルディコアに泳ぎを教えるようたのまれたことはありません（E）。", "chad-party/order": "まずエゴール王がチャド卿に古い本をさがすようたのみました（C）。次にチャドはリナにパンとケーキを焼くようたのみました（B）。リナが焼いている間にフィフィがケーキをぬすみましたが（A）、最後にはパーティーに十分な食べ物を守ることができました（D）。この話に海の怪物は出てきません（E）。", "chad-wand/order": "ヘーゼルがなくした魔法のつえをさがしに来ました（C）。チャド卿はカーテンの後ろにつえを持ってかくれているフィフィを見つけ（B）、ヘーゼルにつえを返しました（D）。お礼に、ヘーゼルは彼に魔法の薬のびんをあげました（A）。カエルに変えてしまうかもしれないのは薬のほうで、リヴァイアサン王をカエルに変えた人はいません（E）。", "chad-race/order": "オフィーリア姫が旗をふってレースが始まり（C）、チャド卿はベイダーに乗ってゴールへ向かいましたが（D）、ベイダーが止まって草を食べてしまいました（B）。レースのあと、リヴァイアサン王は彼に金メダルをあげました（A）。チャドは2位だったので、金のかんむりはもらっていません（E）。"};

// ---- the rescue. If the dragon has carried off the princess and her island has a blacksmith and a
// tavern, the blacksmith builds a boat on the shore, a knight walks out of the tavern and sails away,
// and 3 minutes later he sails back with the princess, who walks home to her castle.
const TAVERN=16,BUILD_MS=20000,AWAY_MS=180000,SAIL=1.6,RESCUE_DELAY=8000;
const KNIGHT_BODY=['..R..','.MMM.','MMVMM','.MMM.','MAAAM','MAWAM','.AAA.'];
const knightLook={R:'#c8453d',M:'#c3cbd3',V:'#22363d',A:'#8a94a0',W:'#3f6fb0',P:'#6e7782',B:'#2a211c'};
// boat, 14 x 10 pixels: mast M, sail S, hull H (light) and h (dark)
const BOAT=['......M.......','......MS......','......MSS.....','......MSSS....','......MSSSS...','......MSSSSS..','......M.......','HHHHHHHHHHHHHH','.hhhhhhhhhhhh.','..hhhhhhhhhh..'];
const BOATC={M:'#5e3a22',S:'#fafaf0',H:'#b07a45',h:'#7a4a2a'};
let rescues=new Map();
// ---- the blacksmith's boat trips: with no tree left on his own island, he may build a little boat, sail to a growing
// tree on another island, give it 6 hits and sail home with the log. Each trip cuts the tree a bit; 3 trips fell it.
const TRIP_BUILD=6000,TRIP_CUTS=3;
let trips=new Map();   // smith's house -> {stage:'build'|'sail'|'moored', boat, path, progress, escort}
function seaRoutes(from){const d=new Int16Array(N*N).fill(-1),prev=new Int16Array(N*N).fill(-1),q=[from];d[from]=0;
  for(let h=0;h<q.length;h++){const j=q[h],x=j%N,y=(j/N)|0;for(const[a,b]of D4){const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=N||ny>=N)continue;
    const r=ny*N+nx;if(grid[r]||lake[r]||d[r]>=0)continue;d[r]=d[j]+1;prev[r]=j;q.push(r);}}
  return{d,prev};}
function shoreSpots(c){const out=[];for(let s=0;s<N*N;s++){if(!grid[s]||comp[s]!==c||houses.has(s)||solidCell(s))continue;const x=s%N,y=(s/N)|0;
  for(const[a,b]of D4){const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=N||ny>=N)continue;const w=ny*N+nx;if(grid[w]||lake[w])continue;out.push({s,w,dir:[a,b]});}}
  return out;}
function planTrip(i,p,now){const home=comp[i];if(home<0)return null;
  const cand=[];for(const[t,tr]of trees){if(!grid[t]||comp[t]===home||tr.apple||now-tr.start<TREE_STAGE*2)continue;cand.push(t);}
  if(!cand.length)return null;
  // the whole trip is weighed: the walk to the shore, the sail, and the walk from the landing to the tree
  const lands=[];for(const t of cand)for(const sp of shoreSpots(comp[t]))lands.push({t,sp,walk:Math.hypot(sp.s%N-t%N,((sp.s/N)|0)-((t/N)|0))});
  let best=null;
  for(const dock of shoreSpots(home)){const sr=seaRoutes(dock.w),walk=Math.hypot(dock.s%N+.5-p.x,((dock.s/N)|0)+.5-p.y);
    for(const l of lands){if(sr.d[l.sp.w]<0)continue;const sc=walk+sr.d[l.sp.w]*.6+l.walk*1.5;
      if(!best||sc<best.sc)best={sc,dock,t:l.t,land:l.sp,prev:sr.prev};}}
  if(!best)return null;
  const route=[];for(let j=best.land.w;j!==best.dock.w;j=best.prev[j])route.push(j);route.push(best.dock.w);route.reverse();
  return{type:'sail',tree:best.t,dock:best.dock,land:best.land,route,stage:'toDock'};}
const shoreXY=sp=>[sp.s%N+.5+sp.dir[0]*.3,((sp.s/N)|0)+.8+sp.dir[1]*.25];
function tripArrive(i,p,now){const j=p.job;
  if(j.stage==='toDock'){j.stage='build';p.mode='tripbuild';p.face=j.dock.dir[0]<0?-1:j.dock.dir[0]>0?1:p.face;const w=j.dock.w;
    trips.set(i,{stage:'build',progress:0,boat:{x:w%N+.5,y:((w/N)|0)+.7,face:j.dock.dir[0]<0?-1:1},escort:null,path:[]});}
  else if(j.stage==='toTree'){if(trees.has(j.tree)){p.mode='chop';p.chopUntil=now+SWING_MS;p.face=(j.tree%N+.5)>p.x?1:-1;}else tripLeave(i,p);}
  else if(j.stage==='toBoat')board(i,p,'back');
  else if(j.stage==='home'){p.carry=false;p.job=null;p.mode='wander';p.tx=p.x;p.ty=p.y;p.wait=1000;}}
function tripLeave(i,p){const j=p.job;j.stage='toBoat';p.dest='boat';const[x,y]=shoreXY(j.land);if(!goTo(p,j.land.s,x,y))board(i,p,'back');}
function board(i,p,dir){const r=trips.get(i);
  if(!r){p.job=null;p.inBoat=false;p.carry=false;p.mode='wander';p.x=p.home%N+.5;p.y=((p.home/N)|0)+1.1;p.tx=p.x;p.ty=p.y;return;}
  p.inBoat=true;p.mode='boat';p.path=[];p.job.stage=dir==='out'?'sailOut':'sailBack';r.stage='sail';r.escort=p;
  r.path=(dir==='out'?p.job.route:[...p.job.route].reverse()).map(w=>[w%N+.5,((w/N)|0)+.7]);}
function updateTrips(now,dt){
  for(const[i,r]of trips){const p=people.get(i);
    if(r.fade){r.boatFade=r.fade;if(now-r.fade>1500)trips.delete(i);continue;}
    if(!p||!houses.has(i)||!p.job||p.job.type!=='sail'){
      if(p&&p.inBoat){p.inBoat=false;p.carry=false;p.job=null;p.mode='wander';p.x=i%N+.5;p.y=((i/N)|0)+1.1;p.tx=p.x;p.ty=p.y;}
      r.escort=null;r.fade=now;continue;}
    if(dragon)continue;
    if(r.stage==='build'){r.progress=Math.min(1,r.progress+dt/TRIP_BUILD);if(r.progress>=1)board(i,p,'out');continue;}
    if(r.stage!=='sail')continue;

      if(j.stage==='sailOut'){[p.x,p.y]=shoreXY(j.land);p.tx=p.x;p.ty=p.y;j.stage='toTree';p.dest='tree';const side=p.x<=j.tree%N+.5?-1:1;
        if(!trees.has(j.tree)||!goTo(p,j.tree,j.tree%N+.5+side*.55,((j.tree/N)|0)+.9))board(i,p,'back');}
      else{[p.x,p.y]=shoreXY(j.dock);p.tx=p.x;p.ty=p.y;j.stage='home';r.fade=now;
        if(!goHome(p)){p.carry=false;p.job=null;p.mode='wander';}}
      continue;}
    const dx=t[0]-r.boat.x,dy=t[1]-r.boat.y,d=Math.hypot(dx,dy),mv=SAIL*.6*dt/1000;if(Math.abs(dx)>.02)r.boat.face=dx>0?1:-1;
    if(d<=mv){r.boat.x=t[0];r.boat.y=t[1];r.path.shift();}else{r.boat.x+=dx/d*mv;r.boat.y+=dy/d*mv;}
    p.x=r.boat.x;p.y=r.boat.y;}}
const rescueBuilder=i=>{for(const r of rescues.values())if(r.smith===i&&r.stage==='build')return r;return null;};
function laneClear(w,dir){let x=w%N,y=(w/N)|0;for(;;){x+=dir[0];y+=dir[1];if(x<0||y<0||x>=N||y>=N)return true;if(grid[y*N+x])return false;}}
function findDock(c,fx,fy){let best=null;
  for(let s=0;s<N*N;s++){if(!grid[s]||comp[s]!==c||houses.has(s))continue;const x=s%N,y=(s/N)|0;
    for(const[a,b]of D4){const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=N||ny>=N)continue;const w=ny*N+nx;if(grid[w]||lake[w])continue;
      const sc=Math.hypot(x+.5-fx,y+.5-fy)+(laneClear(w,[a,b])?0:40);if(!best||sc<best.sc)best={s,w,dir:[a,b],sc};}}
  return best;}
function walker(body,look,x,y,extra){return{x,y,path:[],wait:0,born:Date.now(),face:1,step:0,mode:'wander',body,look,...extra};}
function walkTo(o,from,to){const path=from>=0&&grid[from]?pathTo(from,to):null;
  o.path=path?path.map(j=>[j%N+.5,((j/N)|0)+.65]):[[to%N+.5,((to/N)|0)+.65]];}
function follow(o,dt,speed){const t=o.path[0];if(!t){o.wait=1;return true;}o.wait=0;
  const dx=t[0]-o.x,dy=t[1]-o.y,d=Math.hypot(dx,dy),mv=speed*dt/1000;if(Math.abs(dx)>.03)o.face=dx>0?1:-1;o.step+=dt;
  o.dir=Math.abs(dy)>Math.abs(dx)*1.2?(dy>0?'down':'up'):'side';
  if(d<=mv){o.x=t[0];o.y=t[1];o.path.shift();return !o.path.length;}o.x+=dx/d*mv;o.y+=dy/d*mv;return false;}
const boatHome=r=>[r.water%N+.5,((r.water/N)|0)+.7];
function offBoard(r){const[hx,hy]=boatHome(r);let k=0;while(true){k++;const x=hx+r.dir[0]*k,y=hy+r.dir[1]*k;if(x<-3||y<-3||x>N+3||y>N+4)return[x,y];}}
function islandHouse(c,v){for(const[j,hv]of houses)if(hv.v===v&&grid[j]&&comp[j]===c)return j;return -1;}
function updateRescues(now,dt){
  for(const[i,h]of houses){if(!isCastle(h)||!h.taken||!grid[i]||rescues.has(i))continue;
    const c=comp[i];
    if(h.rescue&&h.rescue.departAt){// a rescue was under way when the game was closed: the knight is still out at sea
      rescues.set(i,{stage:'away',dock:h.rescue.dock,water:h.rescue.water,dir:h.rescue.dir,departAt:h.rescue.departAt,progress:1,
        knight:walker(KNIGHT_BODY,knightLook,0,0,{knight:true}),boat:{x:0,y:0,face:1}});continue;}
    if(now-h.taken<RESCUE_DELAY)continue;
    const smith=islandHouse(c,BLACKSMITH),tav=islandHouse(c,TAVERN);if(smith<0||tav<0||!people.has(smith))continue;
    const sp=people.get(smith),d=findDock(c,sp.x,sp.y);if(!d)continue;

    [r.boat.x,r.boat.y]=boatHome(r);rescues.set(i,r);toast(tr('The blacksmith is building a boat to rescue the princess!','かじ屋さんがお姫さまを助けるための船を作っています！'));}
  for(const[i,r]of rescues){const h=houses.get(i);
    if(!isCastle(h)||(!h.taken&&!r.freed)){const sp=people.get(r.smith);if(sp&&sp.job&&sp.job.type==='boat'){sp.job=null;sp.mode='wander';}rescues.delete(i);continue;}
    if(dragon)continue;
    if(r.stage==='build'){const p=people.get(r.smith);if(!p||!houses.has(r.smith)){rescues.delete(i);continue;}
      if(p.mode==='build'){r.progress=Math.min(1,r.progress+dt/BUILD_MS);
        if(r.progress>=1){p.mode='wander';p.job=null;goHome(p);r.stage='knight';
          const tv=houses.get(r.tavern)?r.tavern:islandHouse(comp[i],TAVERN);
          const door=tv>=0?doorOf(tv,houses.get(tv)):{px:(r.dock%N)*T+8,cell:r.dock};
          r.knight=walker(KNIGHT_BODY,knightLook,door.px/T,((door.cell/N)|0)+.3,{knight:true});
          walkTo(r.knight,door.cell,r.dock);r.knight.path.push([r.dock%N+.5+r.dir[0]*.35,((r.dock/N)|0)+.75+r.dir[1]*.35]);

    else if(r.stage==='knight'){if(follow(r.knight,dt,WALK)){r.knight.inBoat=true;r.stage='out';toast(tr('The knight sets sail to rescue the princess!','騎士がお姫さまを助けに船出しました！'));}}
