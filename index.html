        r.knight.inBoat=true;r.escort=walker(PRINCESS_BODY,princessLook(i),0,0,{princess:true,inBoat:true});}}
    else if(r.stage==='back'){const[hx,hy]=boatHome(r),dx=hx-r.boat.x,dy=hy-r.boat.y,d=Math.hypot(dx,dy),mv=SAIL*dt/1000;
      if(d<=mv){r.boat.x=hx;r.boat.y=hy;r.stage='land';toast(tr('The knight is back with the princess!','騎士がお姫さまを連れて帰ってきました！'));
        const sx=r.dock%N+.5,sy=((r.dock/N)|0)+.75;
        r.knight.inBoat=false;r.knight.x=sx-.25;r.knight.y=sy;r.escort.inBoat=false;r.escort.x=sx+.25;r.escort.y=sy;
        walkTo(r.escort,r.dock,doorOf(i,h).cell);
        const tv=islandHouse(comp[i],TAVERN);r.homeTo=tv>=0?doorOf(tv,houses.get(tv)).cell:doorOf(i,h).cell;walkTo(r.knight,r.dock,r.homeTo);}
      else{r.boat.x+=dx/d*mv;r.boat.y+=dy/d*mv;}}
    else if(r.stage==='land'){
      if(r.escort&&follow(r.escort,dt,WALK*.85)){r.freed=true;houses.set(i,{...houses.get(i),taken:0,rescue:null});save();r.escort=null;}
      if(r.knight&&!r.knight.gone&&follow(r.knight,dt,WALK)){r.knight.gone=now;}
      if(r.knight&&r.knight.gone&&now-r.knight.gone>900)r.knight=null;
      if(!r.escort&&!r.knight){r.boatFade=r.boatFade||now;if(now-r.boatFade>1500)rescues.delete(i);}}
  }}
// the knight rides a horse in a blue cloth with gold trim, carrying a lance with a red pennant (faces right)
const KNIGHT_A=['......RR....L.......','.....RMMM...LPP.....','.....MMMMm..LP......','.....MMMVV..L.......','.....mMMMm..L.......','....SMWWMm..L....h..',
 '...SSMWYWm..L...NHh.','...SSmWWWm..L..NHHHH','....SmWWMm..L.NHHHEH','.N.CCCCCCCCCCNHH.hHH','NN.CYCCCCCCCYCHH..hh','N..CcccccccccCHH....','N..cYcYcYcYcYcH.....',
 '...hHH......HHh.....','...H.H......H.H.....','...K.K......K.K.....'];
const KNIGHT_B=KNIGHT_A.slice(0,13).concat(['...hHH......HHh.....','..H...H....H...H....','..K...K....K...K....']);
// riding towards the camera (going down) and away from it (going up)
const KNIGHT_DOWN=[[".....RR....P", "....MMMM...L", "...MMMMMM..L", "...MVVVVM..L", "...mMMMMm..L", "..AAWWWWAA.L", ".SAAWYYWAAAL", ".SSAWWWWAA.L", ".SSh.HH.h..L", ".CCCHLLHCCC.", ".CYCELLECYC.", ".CCCHLLHCCC.", ".CcccHHcccC.", "..cc.KK.cc..", "...HH..HH...", "...H....H...", "...K....K..."],[".....RR....P", "....MMMM...L", "...MMMMMM..L", "...MVVVVM..L", "...mMMMMm..L", "..AAWWWWAA.L", ".SAAWYYWAAAL", ".SSAWWWWAA.L", ".SSh.HH.h..L", ".CCCHLLHCCC.", ".CYCELLECYC.", ".CCCHLLHCCC.", ".CcccHHcccC.", "..cc.KK.cc..", "...HH..HH...", "..H......H..", "..K......K.."]],KNIGHT_UP=[["P....RR.....", "L...MMMM....", "L..MMMMMM...", "L..MMMMMM...", "L..mMMMMm...", "L.AAWWWWAA..", "LAAAWYYWAAS.", "L.AAWWWWAASS", "L.CCCCCCCCSS", ".CCYCCCCYCC.", ".CCCCCCCCCC.", ".CcccccccccC", "..ccNNNNcc..", "...HNNNNH...", "...H.NN.H...", "...H....H...", "...K....K..."],["P....RR.....", "L...MMMM....", "L..MMMMMM...", "L..MMMMMM...", "L..mMMMMm...", "L.AAWWWWAA..", "LAAAWYYWAAS.", "L.AAWWWWAASS", "L.CCCCCCCCSS", ".CCYCCCCYCC.", ".CCCCCCCCCC.", ".CcccccccccC", "..ccNNNNcc..", "...HNNNNH...", "..H..NN..H..", "..H......H..", "..K......K.."]];
const KNIGHTC={R:'#c8453d',M:'#c3cbd3',m:'#8a94a0',V:'#22363d',W:'#3f6fb0',Y:'#f2c94c',S:'#7a4a2a',L:'#d9c7a0',P:'#c8453d',
  H:'#8a5a36',h:'#5e3a22',N:'#3a2416',E:'#22363d',C:'#3f6fb0',c:'#2f5288',K:'#2a211c'};
function drawKnight(o,ts,kp,now,noLegs){
  const fr=(o.wait<=0&&Math.floor(o.step/170)%2)?1:0,side=!o.dir||o.dir==='side'||noLegs;
  const rows=side?(fr?KNIGHT_B:KNIGHT_A):(o.dir==='down'?KNIGHT_DOWN:KNIGHT_UP)[fr],Wd=rows[0].length,Ht=noLegs?13:rows.length,w=Wd*kp,h=rows.length*kp;
  const ox=Math.round(o.x*ts-w/2),oy=Math.round(o.y*ts-h),X=c=>ox+(side&&o.face<0?Wd-1-c:c)*kp,on=(c,r)=>r>=0&&r<Ht&&c>=0&&c<Wd&&rows[r][c]!=='.';
  const a0=tctx.globalAlpha;tctx.globalAlpha=a0*Math.min(1,(now-o.born)/900);
  if(!noLegs){tctx.fillStyle='rgba(20,40,30,.25)';tctx.fillRect(ox+2*kp,oy+h-kp/2,(Wd-6)*kp,kp);}
  tctx.fillStyle='#22363d';
  for(let r=0;r<Ht;r++)for(let c=0;c<Wd;c++)if(on(c,r))for(const[dx,dy]of D4)if(!on(c+dx,r+dy))tctx.fillRect(X(c+dx),oy+(r+dy)*kp,kp,kp);
  for(let r=0;r<Ht;r++)for(let c=0;c<Wd;c++)if(on(c,r)){tctx.fillStyle=KNIGHTC[rows[r][c]];tctx.fillRect(X(c),oy+r*kp,kp,kp);}
  if(dragon)drawBang(side?X(7)-2*kp:ox+Math.round((Wd/2-2.5)*kp),oy,kp,now);
  tctx.globalAlpha=a0;}
// the boat is drawn larger than people so a knight and his horse fit in it
function drawBoat(r,ts,kp,now){const kq=kp;kp=Math.round(kp*1.7);if(r.stage==='away')return;const b=r.boat,W=14,H=10,w=W*kp,ox=Math.round(b.x*ts-w/2),oy=Math.round(b.y*ts-H*kp+kp*2);
  const X=c=>ox+(b.face<0?W-1-c:c)*kp,bob=r.stage==='build'?0:Math.round(Math.sin(now/300)*kp*.5);
  const a0=tctx.globalAlpha;if(r.boatFade)tctx.globalAlpha=Math.max(0,1-(now-r.boatFade)/1500);
  const prog=r.stage==='build'?r.progress:1;
  const show=(ch,c,row)=>{if(ch==='.')return false;if(ch==='H'||ch==='h')return c<Math.ceil(W*Math.min(1,prog/.6));if(ch==='M')return prog>.6&&row>=6-Math.floor((prog-.6)/.25*7);return prog>.85;};
  const paint=(rows0,rows1)=>{for(let row=rows0;row<rows1;row++)for(let c=0;c<W;c++){const ch=BOAT[row][c];if(!show(ch,c,row))continue;
    tctx.fillStyle='#22363d';for(const[dx,dy]of D4)tctx.fillRect(X(c)+dx*kp*(b.face<0?-1:1),oy+bob+(row+dy)*kp,kp,kp);}
    for(let row=rows0;row<rows1;row++)for(let c=0;c<W;c++){const ch=BOAT[row][c];if(!show(ch,c,row))continue;tctx.fillStyle=BOATC[ch];tctx.fillRect(X(c),oy+bob+row*kp,kp,kp);}};
  paint(0,7);// mast and sail behind the riders
  const deck=(oy+bob+8*kp)/ts;
  for(const q of [r.knight,r.escort])if(q&&q.inBoat){const sx=q.x,sy=q.y;q.face=b.face;q.wait=1;
    if(q.knight){q.x=b.x-.15*(b.face<0?-1:1);q.y=deck+3*kq/ts;drawKnight(q,ts,kq,now,true);}
    else{q.x=b.x+.55*(b.face<0?-1:1);q.y=deck;drawPerson(q,ts,kq,now);}q.x=sx;q.y=sy;}
  paint(7,10);// hull in front of their legs
  tctx.globalAlpha=a0;}
let last=0,lastG=0;function loop(ts){
  tickPlayed(ts);
  if(ts-lastG>1000){lastG=ts;checkVisits();if(!sheetOpen)maybeDragon(Date.now(),1);if(applePos===null&&sheet.complete&&sheet.naturalWidth)findApplePos();growApples(Date.now());const ch=decideTrees(Date.now())|openShops(Date.now())|growCastles(Date.now())|validateFields()|updateLights(Date.now());if(ch||growthSig(Date.now())!==sig)rebuild();}
  if(ts-last>110){tick++;last=ts;render();}drawTrees();requestAnimationFrame(loop);}

// ---- state & UI
let tool='raise',painting=null,history=[],future=[],pending=null;
const $=id=>document.getElementById(id);
function setTool(t){tool=t;$('tRaise').setAttribute('aria-pressed',t==='raise');$('tSink').setAttribute('aria-pressed',t==='sink');}
$('tRaise').onclick=()=>setTool('raise');$('tSink').onclick=()=>setTool('sink');
const snap=()=>({s:spent,g:grid.slice(),b:born.slice(),d:decided.slice(),t:new Map([...trees].map(([k,v])=>[k,{...v}])),h:new Map(houses),f:new Map([...fields].map(([k,v])=>[k,{...v}])),l:new Map(lights),br:new Map(bridges)});
function restore(h){if(h.s!==undefined){spent=h.s;goldUI();saveQuiz();}grid=h.g;born=h.b;decided=h.d;trees=h.t;houses=h.h||new Map();fields=h.f||new Map();lights=h.l||new Map();bridges=h.br||new Map();people=new Map();rebuild();render();drawTrees();}
function commit(before){history.push(before);if(history.length>80)history.shift();future=[];histUI();}
function histUI(){$('bUndo').disabled=!history.length;$('bRedo').disabled=!future.length;}
function goBack(){if(!history.length)return;future.push(snap());restore(history.pop());histUI();}
function goForward(){if(!future.length)return;history.push(snap());restore(future.pop());histUI();}
$('bUndo').onclick=goBack;$('bRedo').onclick=goForward;
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();goBack();}else if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();goForward();}});
{let armed=0;const rb=$('bReset');
  rb.onclick=()=>{if(Date.now()<armed){played=0;
      // stop every autosave (including the one when the page closes) so nothing, not even time played, survives the reset
      try{const set=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){if(String(k).startsWith('tidewater-'))return;return set.call(this,k,v);};}catch(e){}
      try{for(const k of Object.keys(localStorage))if(k.startsWith('tidewater-'))localStorage.removeItem(k);}catch(e){}
      location.reload();return;}
    armed=Date.now()+4000;rb.textContent=tr('Tap again to start over','もう一度タップで最初から');rb.classList.add('armed');
    setTimeout(()=>{if(Date.now()>=armed){rb.textContent=tr('Reset','リセット');rb.classList.remove('armed');}},4100);};}
if($('bFlood'))$('bFlood').onclick=()=>{commit(snap());grid=new Uint8Array(N*N);born=new Float64Array(N*N);decided=new Uint8Array(N*N);trees=new Map();houses=new Map();fields=new Map();rebuild();render();};
if($('bSkip'))$('bSkip').onclick=()=>{played+=30000;if(!sheetOpen)maybeDragon(Date.now(),30);checkVisits();try{localStorage.setItem('tidewater-played-v2',String(Math.round(played)));}catch(e){}for(let i=0;i<N*N;i++)if(grid[i])born[i]-=30000;for(const t of trees.values())t.start-=30000;for(const h of houses.values())h.b=(h.b??h.t)-30000;for(const f of fields.values())if(f.p)f.p-=30000;rebuild();render();};
function scatter(){const now=Date.now(),k=3+Math.floor(Math.random()*3);for(let b=0;b<k;b++){let x=1+Math.floor(Math.random()*(N-2)),y=1+Math.floor(Math.random()*(N-3));const n=4+Math.floor(Math.random()*9);
  for(let s=0;s<n;s++){if(!grid[y*N+x]){grid[y*N+x]=1;born[y*N+x]=now;}const r=Math.random();if(r<.25)x++;else if(r<.5)x--;else if(r<.75)y++;else y--;x=Math.max(0,Math.min(N-1,x));y=Math.max(0,Math.min(N-2,y));}}}

let toastT=0;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}
function tryHouse(c){const i=c.y*N+c.x;
  // clicking a house (or right beside it) upgrades it to its second-row version
  for(const[j,h]of houses){if(cheb(j,i)<=1){const v=h.v??hash(j,3)%5;
    if(v<5){if(!pay(UPGRADE_COST,tr(`An upgrade costs ${UPGRADE_COST} gold`,`増築は${UPGRADE_COST}ゴールドです`)))return false;houses.set(j,{t:Date.now(),b:h.b??h.t,v:v+5,f:h.f??(hash(j,9)%2===1),paid:housePaid(h)+UPGRADE_COST});splashes.push({x:(j%N)*T+8,y:((j/N)|0)*T+10,t:performance.now()});return true;}
    toast(v===WITCH?tr('The witch likes her hut just as it is','魔女は今の小屋が気に入っています'):v===CASTLE?tr('The castle is as grand as it gets','お城はこれ以上大きくなりません'):v>=10?tr('Shops can\'t be upgraded','お店は増築できません'):tr('This house is fully upgraded','この家はもう増築できません'));return false;}}
  if(!supported(i)){toast(tr('A house needs land 2 tiles on each side','家を建てるには、左右に2マスずつ土地が必要です'));return false;}
  for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){const q=(c.y+dy)*N+c.x+dx;if(L(c.x+dx,c.y+dy)&&fieldAt(q)>=0){toast(tr('That land is a wheat field','そこは小麦畑です'));return false;}}
  for(const[h,hv]of houses){const dx=Math.abs(h%N-c.x),dy=Math.abs(((h/N)|0)-c.y),cs=isCastle(hv);if(dx<=(cs?4:3)&&dy<=(cs?2:1)){toast(cs?tr('Too close to the castle','お城に近すぎます'):tr('Too close to another house','ほかの家に近すぎます'));return false;}}
  if(!pay(HOUSE_COST,tr(`A house costs ${HOUSE_COST} gold`,`家は${HOUSE_COST}ゴールドです`)))return false;
  {const now=Date.now(),w=remoteIsland(i);houses.set(i,{t:now,b:now,v:w?WITCH:Math.floor(Math.random()*5),f:Math.random()<.5,paid:HOUSE_COST});if(w)toast(tr('A witch has moved in!','魔女が引っこしてきました！'));}
  for(const j of [...trees.keys()])if(cheb(j,i)<=2){trees.delete(j);decided[j]=0;}
  splashes.push({x:c.x*T+8,y:c.y*T+10,t:performance.now()});return true;}
function cellAt(e){const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*W/T),y=Math.floor((e.clientY-r.top)/r.height*H/T);return x>=0&&y>=0&&x<N&&y<N?{x,y}:null;}
function paint(c){if(!c)return;const v=painting;if(grid[c.y*N+c.x]===v)return;if(v&&gold()<COST){noGold();painting=null;return;}if(pending){commit(pending);pending=null;}if(v)spend(COST);else{const hh=houses.get(c.y*N+c.x),back=COST+(hh?housePaid(hh):0);refund(back);if(hh)toast(tr(`Recovered ${back} gold`,`${back}ゴールドが戻りました`));}grid[c.y*N+c.x]=v;born[c.y*N+c.x]=v?Date.now():0;decided[c.y*N+c.x]=0;trees.delete(c.y*N+c.x);houses.delete(c.y*N+c.x);
  if(v)splashes.push({x:c.x*T+8,y:c.y*T+10,t:performance.now()});rebuild();render();}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{const c=cellAt(e);if(!c)return;cv.setPointerCapture(e.pointerId);pending=snap();
  painting=(e.button===2||tool==='sink')?0:1;
  if(painting===1&&grid[c.y*N+c.x]){painting=null;const before=pending;pending=null;if(tryHouse(c)){commit(before);rebuild();render();drawTrees();}return;}
  paint(c);});
cv.addEventListener('pointermove',e=>{const c=cellAt(e);hover=e.pointerType==='mouse'?c:null;if(painting!==null)paint(c);});
const stop=()=>{painting=null;pending=null;};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
cv.addEventListener('pointerleave',()=>{hover=null;});

function stats(){let land=0,isl=0;const seen=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++){if(!grid[i])continue;land++;if(seen[i])continue;isl++;const st=[i];seen[i]=1;
    while(st.length){const j=st.pop(),x=j%N,y=(j/N)|0;for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=N||ny>=N)continue;const q=ny*N+nx;if(grid[q]&&!seen[q]){seen[q]=1;st.push(q);}}}}
  const si=$('sIsl');if(si)si.textContent=isl;$('sLand').textContent=land;const sf=$('sFlw');if(sf)sf.textContent=flowerCount;}
function save(){try{localStorage.setItem('tidewater-grid-v2',Array.from(grid).join(''));localStorage.setItem('tidewater-born-v2',JSON.stringify(Array.from(born)));localStorage.setItem('tidewater-trees-v2',JSON.stringify({d:Array.from(decided),t:[...trees]}));localStorage.setItem('tidewater-houses-v2',JSON.stringify([...houses]));localStorage.setItem('tidewater-fields-v2',JSON.stringify([...fields]));localStorage.setItem('tidewater-lights-v2',JSON.stringify({l:[...lights],b:[...bridges]}));}catch(e){}}
function sample(){const rows=["....................","..##........###.....","..###.......####....",".....#......##......","..........#.........","....###.............","...#####.....##.....","...#####....####....","....##.......##.....","..........#.........","...............###..","..#...........####..","..##...........##...","....................","......####..........","......#..##....#....","......####.....#....",".........#..........","....................","...................."];
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>grid[y*N+x]=ch==='#'?1:0));}
function start(data){
  if(data&&data.v===2&&data.grid){grid=Uint8Array.from(data.grid);if(data.born)born=Float64Array.from(data.born);if(data.trees){decided=Uint8Array.from(data.trees.d);trees=new Map(data.trees.t);}if(data.houses)houses=new Map(data.houses);if(data.fields)fields=new Map(data.fields);}
  else{let s=null,b=null;try{s=localStorage.getItem('tidewater-grid-v2');b=JSON.parse(localStorage.getItem('tidewater-born-v2')||'null');}catch(e){}
    if(s&&s.length===N*N)grid=Uint8Array.from(s,c=>c==='1'?1:0);
    if(Array.isArray(b)&&b.length===N*N)born=Float64Array.from(b);
    try{const tr=JSON.parse(localStorage.getItem('tidewater-trees-v2')||'null');if(tr&&tr.d&&tr.d.length===N*N){decided=Uint8Array.from(tr.d);trees=new Map(tr.t);}
      const hs=JSON.parse(localStorage.getItem('tidewater-houses-v2')||'null');if(Array.isArray(hs))houses=new Map(hs);
      const fs=JSON.parse(localStorage.getItem('tidewater-fields-v2')||'null');if(Array.isArray(fs))fields=new Map(fs);
      const lb=JSON.parse(localStorage.getItem('tidewater-lights-v2')||'null');if(lb){lights=new Map(lb.l||[]);bridges=new Map(lb.b||[]);}}catch(e){}}
  const now=Date.now();for(let i=0;i<N*N;i++){if(grid[i]&&!born[i])born[i]=now;if(decided[i]&&!trees.has(i))decided[i]=0;}
  rebuild();render();requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({v:2,grid:Array.from(grid),born:Array.from(born),trees:{d:Array.from(decided),t:[...trees]},houses:[...houses],fields:[...fields]}));
initLetters();
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
